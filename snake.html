<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#05050d">
<title>Snake — Game Zone By Danish</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

body{
  min-height:100vh;
  font-family:Arial,sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at 15% 10%,#30116b,transparent 35%),
    radial-gradient(circle at 90% 80%,#002d68,transparent 35%),
    #05050d;
  overflow:hidden;
}

.app{
  width:100%;
  max-width:520px;
  margin:auto;
  padding:16px;
}

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
}

.logo{
  font-size:23px;
  font-weight:1000;
  background:linear-gradient(90deg,#00eaff,#9c2cff,#ff24bd);
  -webkit-background-clip:text;
  color:transparent;
}

.by{
  font-size:9px;
  color:#777;
  letter-spacing:3px;
}

.coins{
  background:#171323;
  border:1px solid #ffd21c55;
  border-radius:18px;
  padding:8px 12px;
  font-weight:bold;
}

.coins span{
  color:#ffd21c;
}

.back{
  background:#141426;
  border:1px solid #292941;
  color:#aaa;
  padding:8px 12px;
  border-radius:12px;
  margin-bottom:12px;
}

.card{
  background:#0e0e1bdd;
  border:1px solid #00d9ff25;
  border-radius:24px;
  padding:15px;
  box-shadow:0 20px 60px #0008;
}

.title{
  text-align:center;
  font-size:22px;
  font-weight:1000;
}

.subtitle{
  text-align:center;
  color:#77778c;
  font-size:11px;
  margin:4px 0 12px;
}

.stats{
  display:flex;
  gap:7px;
  margin-bottom:12px;
}

.stat{
  flex:1;
  background:#090914;
  border:1px solid #202038;
  border-radius:13px;
  padding:8px;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:17px;
}

.stat small{
  color:#66667b;
  font-size:8px;
}

.gameWrap{
  position:relative;
  width:min(90vw,390px);
  aspect-ratio:1;
  margin:auto;
}

canvas{
  width:100%;
  height:100%;
  display:block;
  border-radius:20px;
  border:1px solid #00eaff45;
  background:#070713;
  box-shadow:
    0 0 25px #00eaff12,
    inset 0 0 30px #00eaff08;
}

.overlay{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  border-radius:20px;
  background:#000b;
  backdrop-filter:blur(5px);
}

.overlay.show{
  display:flex;
}

.overlayBox{
  text-align:center;
  padding:25px;
}

.overlayIcon{
  font-size:55px;
}

.overlayTitle{
  font-size:27px;
  font-weight:1000;
  margin:5px 0;
}

.reward{
  color:#ffd21c;
  font-weight:bold;
  margin:7px;
}

.controls{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:12px;
}

.btn{
  border:0;
  border-radius:13px;
  padding:12px 5px;
  color:#fff;
  font-weight:900;
  background:linear-gradient(90deg,#008cff,#962cff);
}

.btn.secondary{
  background:#151527;
  border:1px solid #292941;
}

.dpad{
  width:170px;
  margin:14px auto 0;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}

.dpad button{
  height:42px;
  border:1px solid #242440;
  border-radius:12px;
  background:#111121;
  color:#fff;
  font-size:19px;
  font-weight:bold;
}

.dpad button:active{
  transform:scale(.9);
  background:#20203b;
}

.empty{
  visibility:hidden;
}

.sound{
  text-align:center;
  margin-top:10px;
}

.sound button{
  background:#111121;
  border:1px solid #28283e;
  color:#aaa;
  padding:7px 13px;
  border-radius:18px;
}

.coinPop{
  position:fixed;
  color:#ffd21c;
  font-size:18px;
  font-weight:1000;
  pointer-events:none;
  animation:coinUp .8s forwards;
  z-index:50;
}

@keyframes coinUp{
  from{
    opacity:1;
    transform:translateY(0) scale(1);
  }
  to{
    opacity:0;
    transform:translateY(-55px) scale(1.3);
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div>
      <div class="logo">GAME ZONE</div>
      <div class="by">BY DANISH</div>
    </div>

    <div class="coins">
      🪙 <span id="coins">100</span>
    </div>
  </div>

  <button class="back" onclick="goBack()">← Games</button>

  <div class="card">

    <div class="title">🐍 SNAKE</div>
    <div class="subtitle">Eat • Grow • Survive</div>

    <div class="stats">
      <div class="stat">
        <strong id="score">0</strong>
        <small>SCORE</small>
      </div>

      <div class="stat">
        <strong id="high">0</strong>
        <small>BEST</small>
      </div>

      <div class="stat">
        <strong id="speed">1x</strong>
        <small>SPEED</small>
      </div>
    </div>

    <div class="gameWrap">

      <canvas id="game"></canvas>

      <div class="overlay" id="overlay">
        <div class="overlayBox">
          <div class="overlayIcon">💥</div>
          <div class="overlayTitle">GAME OVER</div>
          <div id="finalScore">Score: 0</div>
          <div class="reward" id="reward">+0 🪙</div>

          <button class="btn" onclick="restart()">
            🔄 PLAY AGAIN
          </button>
        </div>
      </div>

    </div>

    <div class="controls">

      <button class="btn" onclick="restart()">
        🔄 RESTART
      </button>

      <button class="btn secondary" onclick="togglePause()">
        ⏸️ PAUSE
      </button>

      <button class="btn secondary" onclick="toggleSound()">
        <span id="soundText">🔊 SOUND</span>
      </button>

    </div>

    <div class="dpad">

      <button class="empty"></button>
      <button onclick="setDirection('up')">⬆️</button>
      <button class="empty"></button>

      <button onclick="setDirection('left')">⬅️</button>
      <button onclick="togglePause()">⏯️</button>
      <button onclick="setDirection('right')">➡️</button>

      <button class="empty"></button>
      <button onclick="setDirection('down')">⬇️</button>
      <button class="empty"></button>

    </div>

  </div>

</div>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const SIZE=20;

let snake;
let food;
let direction;
let nextDirection;

let score=0;
let high=Number(localStorage.getItem("snake_high")||0);

let coins=Number(localStorage.getItem("gzd_coins")||100);

let running=true;
let paused=false;
let soundOn=true;

let gameSpeed=125;
let timer;

document.getElementById("high").textContent=high;
document.getElementById("coins").textContent=coins;

function resize(){

  const rect=canvas.getBoundingClientRect();

  const size=Math.floor(Math.min(rect.width,rect.height));

  canvas.width=size;
  canvas.height=size;

}

resize();

window.addEventListener("resize",resize);

function start(){

  snake=[
    {x:10,y:10},
    {x:9,y:10},
    {x:8,y:10}
  ];

  direction={x:1,y:0};

  nextDirection={x:1,y:0};

  score=0;

  gameSpeed=125;

  running=true;

  paused=false;

  document.getElementById("score").textContent=score;

  document.getElementById("speed").textContent="1x";

  document.getElementById("overlay").classList.remove("show");

  spawnFood();

  clearInterval(timer);

  timer=setInterval(update,gameSpeed);

  draw();

}

function spawnFood(){

  do{

    food={
      x:Math.floor(Math.random()*SIZE),
      y:Math.floor(Math.random()*SIZE)
    };

  }while(
    snake.some(part=>part.x===food.x&&part.y===food.y)
  );

}

function update(){

  if(!running||paused)return;

  direction=nextDirection;

  const head={
    x:snake[0].x+direction.x,
    y:snake[0].y+direction.y
  };

  if(
    head.x<0||
    head.x>=SIZE||
    head.y<0||
    head.y>=SIZE||
    snake.some(part=>part.x===head.x&&part.y===head.y)
  ){

    gameOver();

    return;

  }

  snake.unshift(head);

  if(head.x===food.x&&head.y===food.y){

    score++;

    coins++;

    localStorage.setItem("gzd_coins",coins);

    document.getElementById("coins").textContent=coins;

    document.getElementById("score").textContent=score;

    showCoin();

    beep("eat");

    spawnFood();

    if(score%5===0){

      gameSpeed=Math.max(65,gameSpeed-8);

      clearInterval(timer);

      timer=setInterval(update,gameSpeed);

      document.getElementById("speed").textContent=
        (125/gameSpeed).toFixed(1)+"x";

    }

  }else{

    snake.pop();

  }

  draw();

}

function draw(){

  const size=canvas.width/SIZE;

  ctx.fillStyle="#070713";

  ctx.fillRect(0,0,canvas.width,canvas.height);

  // grid

  ctx.strokeStyle="rgba(0,220,255,.055)";

  ctx.lineWidth=1;

  for(let i=0;i<=SIZE;i++){

    ctx.beginPath();

    ctx.moveTo(i*size,0);

    ctx.lineTo(i*size,canvas.height);

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(0,i*size);

    ctx.lineTo(canvas.width,i*size);

    ctx.stroke();

  }

  // food

  const fx=food.x*size+size/2;
  const fy=food.y*size+size/2;

  ctx.shadowBlur=18;
  ctx.shadowColor="#ff2ca8";

  ctx.fillStyle="#ff2ca8";

  ctx.beginPath();

  ctx.arc(
    fx,
    fy,
    size*.28,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.shadowBlur=0;

  // snake

  snake.forEach((part,index)=>{

    const x=part.x*size;
    const y=part.y*size;

    const padding=2;

    const gradient=ctx.createLinearGradient(
      x,
      y,
      x+size,
      y+size
    );

    gradient.addColorStop(0,"#00f6ff");
    gradient.addColorStop(1,"#0077ff");

    ctx.fillStyle=gradient;

    if(index===0){

      ctx.shadowBlur=15;
      ctx.shadowColor="#00eaff";

    }else{

      ctx.shadowBlur=4;
      ctx.shadowColor="#00aaff";

    }

    ctx.beginPath();

    ctx.roundRect(
      x+padding,
      y+padding,
      size-padding*2,
      size-padding*2,
      6
    );

    ctx.fill();

    ctx.shadowBlur=0;

    if(index===0){

      ctx.fillStyle="#fff";

      const eyeSize=size*.10;

      let ex1=x+size*.34;
      let ex2=x+size*.62;

      let ey=y+size*.30;

      ctx.beginPath();

      ctx.arc(ex1,ey,eyeSize,0,Math.PI*2);

      ctx.arc(ex2,ey,eyeSize,0,Math.PI*2);

      ctx.fill();

    }

  });

}

function setDirection(dir){

  if(!running)return;

  if(dir==="up"&&direction.y!==1)
    nextDirection={x:0,y:-1};

  if(dir==="down"&&direction.y!==-1)
    nextDirection={x:0,y:1};

  if(dir==="left"&&direction.x!==1)
    nextDirection={x:-1,y:0};

  if(dir==="right"&&direction.x!==-1)
    nextDirection={x:1,y:0};

}

document.addEventListener("keydown",e=>{

  if(e.key==="ArrowUp")setDirection("up");

  if(e.key==="ArrowDown")setDirection("down");

  if(e.key==="ArrowLeft")setDirection("left");

  if(e.key==="ArrowRight")setDirection("right");

  if(e.code==="Space")togglePause();

});

let touchStartX=0;
let touchStartY=0;

canvas.addEventListener("touchstart",e=>{

  touchStartX=e.touches[0].clientX;
  touchStartY=e.touches[0].clientY;

},{passive:true});

canvas.addEventListener("touchend",e=>{

  const dx=e.changedTouches[0].clientX-touchStartX;
  const dy=e.changedTouches[0].clientY-touchStartY;

  if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;

  if(Math.abs(dx)>Math.abs(dy)){

    setDirection(dx>0?"right":"left");

  }else{

    setDirection(dy>0?"down":"up");

  }

},{passive:true});

function togglePause(){

  if(!running)return;

  paused=!paused;

  if(paused){

    document.getElementById("overlay").classList.add("show");

    document.querySelector(".overlayTitle").textContent="PAUSED";

    document.querySelector(".overlayIcon").textContent="⏸️";

    document.getElementById("finalScore").textContent=
      "Score: "+score;

    document.getElementById("reward").textContent=
      "Press PAUSE again to continue";

  }else{

    document.getElementById("overlay").classList.remove("show");

    document.querySelector(".overlayTitle").textContent="GAME OVER";

    document.querySelector(".overlayIcon").textContent="💥";

  }

}

function gameOver(){

  running=false;

  clearInterval(timer);

  if(score>high){

    high=score;

    localStorage.setItem("snake_high",high);

    document.getElementById("high").textContent=high;

  }

  const reward=score;

  coins+=reward;

  localStorage.setItem("gzd_coins",coins);

  document.getElementById("coins").textContent=coins;

  document.getElementById("finalScore").textContent=
    "Score: "+score;

  document.getElementById("reward").textContent=
    "+"+reward+" 🪙";

  document.querySelector(".overlayTitle").textContent=
    "GAME OVER";

  document.querySelector(".overlayIcon").textContent="💥";

  document.getElementById("overlay").classList.add("show");

  beep("lose");

}

function restart(){

  start();

}

function toggleSound(){

  soundOn=!soundOn;

  document.getElementById("soundText").textContent=
    soundOn?"🔊 SOUND":"🔇 SOUND";

}

function beep(type){

  if(!soundOn)return;

  try{

    const audio=new(window.AudioContext||window.webkitAudioContext)();

    const osc=audio.createOscillator();

    const gain=audio.createGain();

    osc.connect(gain);

    gain.connect(audio.destination);

    osc.type="sine";

    osc.frequency.value=
      type==="eat"?720:180;

    gain.gain.setValueAtTime(.06,audio.currentTime);

    gain.gain.exponentialRampToValueAtTime(
      .001,
      audio.currentTime+.18
    );

    osc.start();

    osc.stop(audio.currentTime+.18);

  }catch(e){}

}

function showCoin(){

  const el=document.createElement("div");

  el.className="coinPop";

  el.textContent="+1 🪙";

  el.style.left="50%";

  el.style.top="45%";

  document.body.appendChild(el);

  setTimeout(()=>el.remove(),800);

}

function goBack(){

  window.location.href="index.html";

}

start();

</script>

</body>
</html>
