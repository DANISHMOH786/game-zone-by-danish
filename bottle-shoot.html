<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Bottle Shoot - Game Zone By Danish</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  min-height:100%;
  background:#05050d;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow:hidden;
  touch-action:none;
}

.app{
  width:100%;
  max-width:520px;
  margin:auto;
  padding:16px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.logo{
  font-size:23px;
  font-weight:1000;
  background:linear-gradient(90deg,#00eaff,#9c2cff,#ff24bd);
  -webkit-background-clip:text;
  color:transparent;
}

.by{
  font-size:9px;
  color:#777;
  letter-spacing:3px;
}

.coins{
  padding:9px 14px;
  border-radius:20px;
  background:#171323;
  border:1px solid #ffd21c66;
  font-weight:bold;
}

.coins span{
  color:#ffd21c;
}

.back{
  background:#141426;
  color:#aaa;
  border:1px solid #292941;
  border-radius:12px;
  padding:9px 13px;
  margin-bottom:12px;
}

.card{
  background:#0e0e1b;
  border:1px solid #00d9ff35;
  border-radius:24px;
  padding:15px;
  box-shadow:0 20px 60px #0009;
}

.title{
  text-align:center;
  font-size:25px;
  font-weight:1000;
}

.subtitle{
  text-align:center;
  color:#77778c;
  font-size:12px;
  margin:5px 0 12px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  margin-bottom:12px;
}

.stat{
  background:#090914;
  border:1px solid #202038;
  border-radius:13px;
  padding:8px 3px;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:17px;
}

.stat small{
  color:#66667b;
  font-size:8px;
}

.gameWrap{
  position:relative;
  width:min(92vw,410px);
  aspect-ratio:1;
  margin:auto;
}

canvas{
  width:100%;
  height:100%;
  display:block;
  border-radius:22px;
  border:2px solid #00eaff45;
  background:#050711;
}

.overlay{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  border-radius:22px;
  background:#000c;
  backdrop-filter:blur(5px);
  z-index:10;
}

.overlay.show{
  display:flex;
}

.overlayBox{
  text-align:center;
  padding:25px;
}

.overlayIcon{
  font-size:48px;
}

.overlayTitle{
  font-size:28px;
  font-weight:1000;
  margin:5px 0;
}

.overlayText{
  color:#aaa;
  margin:8px 0 16px;
}

.btn{
  border:0;
  border-radius:13px;
  padding:12px 18px;
  color:#fff;
  font-weight:900;
  background:linear-gradient(90deg,#008cff,#962cff);
}

.controls{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:12px;
}

.secondary{
  background:#151527;
  border:1px solid #292941;
}

.help{
  text-align:center;
  color:#77778c;
  font-size:11px;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div>
      <div class="logo">GAME ZONE</div>
      <div class="by">BY DANISH</div>
    </div>

    <div class="coins">
      🪙 <span id="coins">100</span>
    </div>
  </div>

  <button class="back" onclick="goBack()">← Games</button>

  <div class="card">

    <div class="title">🎯 BOTTLE SHOOT</div>

    <div class="subtitle">
      Aim • Shoot • Survive • Level Up
    </div>

    <div class="stats">

      <div class="stat">
        <strong id="score">0</strong>
        <small>SCORE</small>
      </div>

      <div class="stat">
        <strong id="level">1/20</strong>
        <small>LEVEL</small>
      </div>

      <div class="stat">
        <strong id="ammo">0</strong>
        <small>AMMO</small>
      </div>

      <div class="stat">
        <strong id="time">30</strong>
        <small>TIME</small>
      </div>

    </div>

    <div class="gameWrap">

      <canvas id="game"></canvas>

      <div class="overlay" id="overlay">

        <div class="overlayBox">

          <div class="overlayIcon" id="overlayIcon">💥</div>

          <div class="overlayTitle" id="overlayTitle">
            LEVEL FAILED
          </div>

          <div class="overlayText" id="overlayText">
            Try again
          </div>

          <button class="btn" onclick="restartLevel()">
            🔄 TRY AGAIN
          </button>

        </div>

      </div>

    </div>

    <div class="controls">

      <button class="btn" onclick="restartLevel()">
        🔄 RESTART
      </button>

      <button class="btn secondary" onclick="togglePause()">
        ⏸️ PAUSE
      </button>

      <button class="btn secondary" onclick="toggleSound()">
        <span id="soundText">🔊 SOUND</span>
      </button>

    </div>

    <div class="help">
      Tap anywhere on the game to shoot 🎯
    </div>

  </div>

</div>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=400;
let H=400;

function resize(){

  const rect=canvas.getBoundingClientRect();

  W=Math.floor(rect.width);
  H=Math.floor(rect.height);

  canvas.width=W;
  canvas.height=H;
}

resize();

window.addEventListener("resize",resize);


/* =========================
   GAME DATA
========================= */

const MAX_LEVEL=20;

let level=1;
let score=0;

let coins=Number(
  localStorage.getItem("gzd_coins") || 100
);

let ammo=0;
let timeLeft=30;

let running=false;
let paused=false;
let soundOn=true;

let bottles=[];
let bullets=[];

let timerInterval;
let animationId;


/* =========================
   LEVEL SETTINGS
========================= */

function normalBottleCount(){

  if(level===1) return 1;
  if(level===2) return 2;
  if(level===3) return 5;
  if(level===4) return 3;

  return Math.min(
    3 + Math.floor((level-5)/2),
    9
  );
}


function getAmmo(){

  /*
    Ammo is limited but enough to finish
    if player shoots accurately.
  */

  const normal=normalBottleCount();

  return normal * 3 + 4;
}


/* =========================
   PATH
========================= */

function pathPoint(t){

  /*
    Closed rounded rectangle.
    t = 0 to 1
  */

  const margin=Math.min(W,H)*0.17;

  const left=margin;
  const right=W-margin;
  const top=margin;
  const bottom=H-margin;

  const r=Math.min(
    45,
    (right-left)/4
  );

  const straightX=right-left-2*r;
  const straightY=bottom-top-2*r;

  const perimeter=
    2*straightX+
    2*straightY+
    2*Math.PI*r;

  let d=(t%1)*perimeter;

  if(d<straightX){

    return {
      x:left+r+d,
      y:top
    };

  }

  d-=straightX;

  if(d<Math.PI*r/2){

    const a=-Math.PI/2+d/r;

    return {
      x:right-r+r*Math.cos(a),
      y:top+r+r*Math.sin(a)
    };

  }

  /*
    Top-right curve finished.
  */

  d-=Math.PI*r/2;

  if(d<straightY){

    return {
      x:right,
      y:top+r+d
    };

  }

  d-=straightY;

  if(d<Math.PI*r/2){

    const a=d/r;

    return {
      x:right-r+r*Math.cos(a),
      y:bottom-r+r*Math.sin(a)
    };

  }

  d-=Math.PI*r/2;

  if(d<straightX){

    return {
      x:right-r-d,
      y:bottom
    };

  }

  d-=straightX;

  if(d<Math.PI*r/2){

    const a=Math.PI/2+d/r;

    return {
      x:left+r+r*Math.cos(a),
      y:bottom-r+r*Math.sin(a)
    };

  }

  d-=Math.PI*r/2;

  if(d<straightY){

    return {
      x:left,
      y:bottom-r-d
    };

  }

  d-=straightY;

  const a=Math.PI+d/r;

  return {
    x:left+r+r*Math.cos(a),
    y:top+r+r*Math.sin(a)
  };
}


/* =========================
   BOTTLES
========================= */

function createBottle(t, dangerous=false){

  return {

    t:t,

    speed:
      0.000045 +
      level*0.0000025,

    dangerous:dangerous,

    alive:true,

    radius:17,

    rotation:Math.random()*Math.PI*2

  };
}


function createLevel(){

  bottles=[];
  bullets=[];

  ammo=getAmmo();

  timeLeft=Math.max(
    16,
    32-level*0.5
  );

  /*
    IMPORTANT:
    Dangerous bottle is NEVER required
    for level completion.
  */

  const count=normalBottleCount();

  for(let i=0;i<count;i++){

    bottles.push(
      createBottle(
        i/count,
        false
      )
    );

  }

  /*
    Exactly ONE dangerous bottle.
    It can be left alone.
  */

  bottles.push(
    createBottle(
      0.5/count,
      true
    )
  );

  updateUI();

  running=true;
  paused=false;

  hideOverlay();

  clearInterval(timerInterval);

  timerInterval=setInterval(()=>{

    if(!running||paused)return;

    timeLeft--;

    updateUI();

    if(timeLeft<=0){

      failLevel("⏰","TIME UP");

    }

  },1000);

  cancelAnimationFrame(animationId);

  loop();
}


/* =========================
   UI
========================= */

function updateUI(){

  document.getElementById("score").textContent=score;

  document.getElementById("level").textContent=
    level+"/"+MAX_LEVEL;

  document.getElementById("ammo").textContent=
    ammo;

  document.getElementById("time").textContent=
    timeLeft;

  document.getElementById("coins").textContent=
    coins;
}


/* =========================
   DRAW
========================= */

function drawBackground(){

  ctx.fillStyle="#050711";

  ctx.fillRect(
    0,
    0,
    W,
    H
  );

  /*
    Grid
  */

  ctx.strokeStyle="rgba(0,220,255,.055)";

  ctx.lineWidth=1;

  const grid=28;

  for(let x=0;x<W;x+=grid){

    ctx.beginPath();

    ctx.moveTo(x,0);
    ctx.lineTo(x,H);

    ctx.stroke();
  }

  for(let y=0;y<H;y+=grid){

    ctx.beginPath();

    ctx.moveTo(0,y);
    ctx.lineTo(W,y);

    ctx.stroke();
  }
}


function drawPath(){

  const margin=Math.min(W,H)*0.17;

  const left=margin;
  const right=W-margin;
  const top=margin;
  const bottom=H-margin;

  const r=Math.min(
    45,
    (right-left)/4
  );

  ctx.save();

  ctx.beginPath();

  ctx.moveTo(left+r,top);

  ctx.lineTo(right-r,top);

  ctx.quadraticCurveTo(
    right,
    top,
    right,
    top+r
  );

  ctx.lineTo(right,bottom-r);

  ctx.quadraticCurveTo(
    right,
    bottom,
    right-r,
    bottom
  );

  ctx.lineTo(left+r,bottom);

  ctx.quadraticCurveTo(
    left,
    bottom,
    left,
    bottom-r
  );

  ctx.lineTo(left,top+r);

  ctx.quadraticCurveTo(
    left,
    top,
    left+r,
    top
  );

  ctx.closePath();

  ctx.shadowBlur=14;
  ctx.shadowColor="#00eaff";

  ctx.strokeStyle="#dffcff";
  ctx.lineWidth=5;

  ctx.stroke();

  ctx.restore();
}


/* =========================
   BOTTLE DRAWING
========================= */

function drawBottle(b){

  if(!b.alive)return;

  const p=pathPoint(b.t);

  ctx.save();

  ctx.translate(
    p.x,
    p.y
  );

  /*
    Determine path direction.
  */

  const p2=pathPoint(
    b.t+0.002
  );

  const angle=Math.atan2(
    p2.y-p.y,
    p2.x-p.x
  );

  ctx.rotate(angle);

  /*
    Dangerous bottle
  */

  if(b.dangerous){

    ctx.shadowBlur=18;
    ctx.shadowColor="#ff2b2b";

    ctx.fillStyle="#dc2525";

  }else{

    ctx.shadowBlur=15;
    ctx.shadowColor="#00eaff";

    ctx.fillStyle="#16d9f5";
  }

  /*
    Bottle body
  */

  ctx.beginPath();

  ctx.roundRect(
    -15,
    -11,
    30,
    22,
    8
  );

  ctx.fill();

  /*
    Bottle neck
  */

  ctx.fillStyle=
    b.dangerous
    ? "#ffb000"
    : "#e9ffff";

  ctx.fillRect(
    10,
    -6,
    11,
    12
  );

  /*
    Cap
  */

  ctx.fillStyle=
    b.dangerous
    ? "#ff4b00"
    : "#ffffff";

  ctx.fillRect(
    20,
    -7,
    5,
    14
  );

  /*
    Label
  */

  ctx.fillStyle=
    b.dangerous
    ? "#390000"
    : "#ff168e";

  ctx.fillRect(
    -12,
    -6,
    18,
    12
  );

  ctx.fillStyle="#fff";

  ctx.font="bold 6px Arial";

  ctx.textAlign="center";
  ctx.textBaseline="middle";

  ctx.fillText(
    b.dangerous?"DANGER":"ZONE",
    -3,
    0
  );

  /*
    Dangerous warning
  */

  if(b.dangerous){

    ctx.fillStyle="#fff";

    ctx.font="bold 14px Arial";

    ctx.fillText(
      "!",
      0,
      -22
    );

  }

  ctx.restore();
}


/* =========================
   GUN
========================= */

const gun={
  x:0,
  y:0,
  recoil:0,
  angle:0
};


function drawGun(){

  /*
    ALWAYS CENTRE.
    It does NOT follow bottles.
  */

  gun.x=W/2;
  gun.y=H/2;

  ctx.save();

  ctx.translate(
    gun.x,
    gun.y
  );

  ctx.rotate(gun.angle);

  const recoil=gun.recoil;

  /*
    Barrel
  */

  ctx.shadowBlur=10;
  ctx.shadowColor="#00eaff";

  ctx.fillStyle="#e9f4ff";

  ctx.fillRect(
    2-recoil,
    -7,
    62,
    14
  );

  /*
    Barrel end
  */

  ctx.fillStyle="#777";

  ctx.fillRect(
    58-recoil,
    -9,
    12,
    18
  );

  /*
    Gun body
  */

  ctx.fillStyle="#444";

  ctx.beginPath();

  ctx.roundRect(
    -22,
    -15,
    34,
    30,
    8
  );

  ctx.fill();

  /*
    Grip
  */

  ctx.save();

  ctx.rotate(
    0.15
  );

  ctx.fillStyle="#9a542b";

  ctx.beginPath();

  ctx.roundRect(
    -3,
    10,
    16,
    36,
    6
  );

  ctx.fill();

  ctx.restore();

  /*
    Trigger
  */

  ctx.strokeStyle="#ddd";
  ctx.lineWidth=3;

  ctx.beginPath();

  ctx.arc(
    2,
    6,
    7,
    0,
    Math.PI
  );

  ctx.stroke();

  ctx.restore();

  /*
    recoil
  */

  gun.recoil*=0.75;

}


/* =========================
   BULLETS
========================= */

function shoot(targetX,targetY){

  if(!running||paused)return;

  if(ammo<=0){

    beep("empty");

    return;
  }

  ammo--;

  updateUI();

  const dx=
    targetX-gun.x;

  const dy=
    targetY-gun.y;

  const len=
    Math.sqrt(dx*dx+dy*dy)||1;

  const vx=dx/len;
  const vy=dy/len;

  gun.angle=
    Math.atan2(
      dy,
      dx
    );

  gun.recoil=10;

  bullets.push({

    x:gun.x,
    y:gun.y,

    vx:vx*12,
    vy:vy*12,

    life:60

  });

  beep("shoot");
}


/* =========================
   BULLET UPDATE
========================= */

function updateBullets(){

  bullets.forEach(b=>{

    b.x+=b.vx;
    b.y+=b.vy;

    b.life--;

  });

  bullets=
    bullets.filter(
      b=>
        b.life>0 &&
        b.x>-30 &&
        b.x<W+30 &&
        b.y>-30 &&
        b.y<H+30
    );
}


/* =========================
   COLLISION
========================= */

function checkHits(){

  for(const bullet of bullets){

    for(const bottle of bottles){

      if(!bottle.alive)continue;

      const p=
        pathPoint(bottle.t);

      const dx=
        bullet.x-p.x;

      const dy=
        bullet.y-p.y;

      const dist=
        Math.sqrt(
          dx*dx+
          dy*dy
        );

      if(dist<25){

        /*
          BULLET HIT DANGEROUS BOTTLE
          = LEVEL FAILED.
        */

        if(bottle.dangerous){

          failLevel(
            "💣",
            "Dangerous bottle hit!"
          );

          return;
        }

        /*
          NORMAL BOTTLE
        */

        bottle.alive=false;

        score+=10;

        coins+=1;

        localStorage.setItem(
          "gzd_coins",
          coins
        );

        updateUI();

        beep("hit");

        /*
          Remove bullet.
        */

        bullet.life=0;

        /*
          Check only NORMAL bottles.
          Dangerous bottle does NOT count.
        */

        const remaining=
          bottles.some(
            x=>
              x.alive &&
              !x.dangerous
          );

        if(!remaining){

          levelComplete();

        }

        break;
      }
    }
  }
}


/* =========================
   GAME LOOP
========================= */

function loop(){

  if(!running){

    draw();

    return;
  }

  if(!paused){

    /*
      Move bottles.
    */

    bottles.forEach(b=>{

      if(!b.alive)return;

      b.t+=b.speed;

      if(b.t>=1){
        b.t-=1;
      }

    });

    updateBullets();

    checkHits();
  }

  draw();

  animationId=
    requestAnimationFrame(loop);
}


function draw(){

  drawBackground();

  drawPath();

  /*
    Bottles first.
  */

  bottles.forEach(
    drawBottle
  );

  /*
    Bullets.

    Draw before gun so gun stays
    visually on top.
  */

  ctx.fillStyle="#fff";

  bullets.forEach(b=>{

    ctx.shadowBlur=12;
    ctx.shadowColor="#00eaff";

    ctx.beginPath();

    ctx.arc(
      b.x,
      b.y,
      4,
      0,
      Math.PI*2
    );

    ctx.fill();

  });

  ctx.shadowBlur=0;

  /*
    Gun ALWAYS last + centre.
  */

  drawGun();
}


/* =========================
   LEVEL COMPLETE
========================= */

function levelComplete(){

  if(!running)return;

  running=false;

  clearInterval(timerInterval);

  const reward=
    10+
    level*2;

  coins+=reward;

  localStorage.setItem(
    "gzd_coins",
    coins
  );

  updateUI();

  if(level>=MAX_LEVEL){

    showOverlay(
      "🏆",
      "YOU WIN!",
      "All 20 levels completed!"
    );

    return;
  }

  showOverlay(
    "🎯",
    "LEVEL COMPLETE",
    "Level "+level+
    " completed!  +"+
    reward+
    " 🪙"
  );

  /*
    Automatically move to next level
    after short delay.
  */

  setTimeout(()=>{

    if(
      document.getElementById(
        "overlay"
      ).classList.contains("show")
    ){

      level++;

      createLevel();

    }

  },1500);
}


/* =========================
   FAIL
========================= */

function failLevel(icon,title){

  if(!running)return;

  running=false;

  clearInterval(timerInterval);

  showOverlay(
    icon,
    "LEVEL FAILED",
    title
  );

  beep("lose");
}


/* =========================
   OVERLAY
========================= */

function showOverlay(
  icon,
  title,
  text
){

  document.getElementById(
    "overlayIcon"
  ).textContent=icon;

  document.getElementById(
    "overlayTitle"
  ).textContent=title;

  document.getElementById(
    "overlayText"
  ).textContent=text;

  document.getElementById(
    "overlay"
  ).classList.add("show");
}


function hideOverlay(){

  document.getElementById(
    "overlay"
  ).classList.remove("show");
}


/* =========================
   RESTART
========================= */

function restartLevel(){

  createLevel();

}


function togglePause(){

  if(!running)return;

  paused=!paused;

  if(paused){

    showOverlay(
      "⏸️",
      "PAUSED",
      "Tap PAUSE again to continue"
    );

  }else{

    hideOverlay();

  }
}


/* =========================
   TOUCH
========================= */

canvas.addEventListener(
  "pointerdown",
  e=>{

    const rect=
      canvas.getBoundingClientRect();

    const x=
      e.clientX-rect.left;

    const y=
      e.clientY-rect.top;

    shoot(x,y);

  }
);


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
  "keydown",
  e=>{

    if(e.code==="Space"){

      shoot(
        W/2+100,
        H/2
      );

    }

  }
);


/* =========================
   SOUND
========================= */

function toggleSound(){

  soundOn=!soundOn;

  document.getElementById(
    "soundText"
  ).textContent=
    soundOn
      ?"🔊 SOUND"
      :"🔇 SOUND";
}


function beep(type){

  if(!soundOn)return;

  try{

    const audio=
      new(
        window.AudioContext||
        window.webkitAudioContext
      )();

    const osc=
      audio.createOscillator();

    const gain=
      audio.createGain();

    osc.connect(gain);

    gain.connect(
      audio.destination
    );

    let freq=500;

    if(type==="shoot")freq=650;
    if(type==="hit")freq=850;
    if(type==="empty")freq=120;
    if(type==="lose")freq=150;

    osc.frequency.value=freq;

    gain.gain.setValueAtTime(
      .05,
      audio.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      .001,
      audio.currentTime+.12
    );

    osc.start();

    osc.stop(
      audio.currentTime+.12
    );

  }catch(e){}

}
