<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<meta name="theme-color" content="#05050d">

<title>Bottle Shoot - Game Zone By Danish</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  min-height:100%;
  background:#05050d;
  color:white;
  font-family:Arial,sans-serif;
}

body{
  overflow:hidden;
}

.app{
  width:100%;
  max-width:560px;
  margin:auto;
  padding:14px;
}

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
}

.logo{
  font-size:23px;
  font-weight:1000;
  background:linear-gradient(
    90deg,
    #00eaff,
    #9c2cff,
    #ff24bd
  );
  -webkit-background-clip:text;
  color:transparent;
}

.by{
  color:#777;
  font-size:8px;
  letter-spacing:3px;
}

.coins{
  padding:8px 13px;
  border-radius:18px;
  background:#171323;
  border:1px solid #ffd21c55;
  font-weight:bold;
}

.coins span{
  color:#ffd21c;
}

.back{
  border:1px solid #292941;
  background:#141426;
  color:#aaa;
  padding:8px 13px;
  border-radius:12px;
  margin-bottom:10px;
}

.card{
  background:#0e0e1bdd;
  border:1px solid #00d9ff25;
  border-radius:24px;
  padding:14px;
  box-shadow:0 20px 60px #0008;
}

.title{
  text-align:center;
  font-size:23px;
  font-weight:1000;
}

.subtitle{
  text-align:center;
  color:#77778c;
  font-size:11px;
  margin:4px 0 11px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  margin-bottom:10px;
}

.stat{
  background:#090914;
  border:1px solid #202038;
  border-radius:13px;
  padding:8px 3px;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:17px;
}

.stat small{
  color:#66667b;
  font-size:7px;
}

.gameWrap{
  position:relative;
  width:min(92vw,430px);
  aspect-ratio:3/4;
  margin:auto;
}

canvas{
  width:100%;
  height:100%;
  display:block;
  border-radius:20px;
  border:1px solid #00eaff45;
  background:#070713;
  box-shadow:
    0 0 25px #00eaff12,
    inset 0 0 30px #00eaff08;
  touch-action:none;
}

.overlay{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  border-radius:20px;
  background:#000b;
  backdrop-filter:blur(5px);
}

.overlay.show{
  display:flex;
}

.overlayBox{
  text-align:center;
  padding:25px;
}

.overlayIcon{
  font-size:52px;
}

.overlayTitle{
  font-size:27px;
  font-weight:1000;
  margin:5px 0;
}

.reward{
  color:#ffd21c;
  font-weight:bold;
  margin:8px;
}

.controls{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-top:10px;
}

.btn{
  border:0;
  border-radius:13px;
  padding:12px 5px;
  color:white;
  font-weight:900;
  background:linear-gradient(
    90deg,
    #008cff,
    #962cff
  );
}

.btn.secondary{
  background:#151527;
  border:1px solid #292941;
}

.hint{
  text-align:center;
  color:#aaa;
  font-size:11px;
  margin-top:10px;
}

.coinPop{
  position:fixed;
  color:#ffd21c;
  font-size:19px;
  font-weight:1000;
  pointer-events:none;
  animation:coinUp .7s forwards;
  z-index:50;
}

@keyframes coinUp{
  from{
    opacity:1;
    transform:translateY(0) scale(1);
  }
  to{
    opacity:0;
    transform:translateY(-55px) scale(1.3);
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="header">

    <div>
      <div class="logo">GAME ZONE</div>
      <div class="by">BY DANISH</div>
    </div>

    <div class="coins">
      🪙 <span id="coins">100</span>
    </div>

  </div>

  <button class="back" onclick="goBack()">
    ← Games
  </button>

  <div class="card">

    <div class="title">
      🎯 BOTTLE SHOOT
    </div>

    <div class="subtitle">
      Aim • Shoot • Break
    </div>

    <div class="stats">

      <div class="stat">
        <strong id="score">0</strong>
        <small>SCORE</small>
      </div>

      <div class="stat">
        <strong id="hits">0</strong>
        <small>HITS</small>
      </div>

      <div class="stat">
        <strong id="shots">0</strong>
        <small>SHOTS</small>
      </div>

      <div class="stat">
        <strong id="time">30</strong>
        <small>TIME</small>
      </div>

    </div>

    <div class="gameWrap">

      <canvas id="game"></canvas>

      <div class="overlay" id="overlay">

        <div class="overlayBox">

          <div class="overlayIcon"
