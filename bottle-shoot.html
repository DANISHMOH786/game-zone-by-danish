<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#05050d">
<title>Bottle Shoot - Game Zone By Danish</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  min-height:100%;
  background:#05050d;
  color:#fff;
  font-family:Arial,sans-serif;
}

body{overflow:hidden}

.app{
  width:100%;
  max-width:560px;
  margin:auto;
  padding:14px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:9px;
}

.logo{
  font-size:23px;
  font-weight:1000;
  background:linear-gradient(90deg,#00eaff,#9c2cff,#ff24bd);
  -webkit-background-clip:text;
  color:transparent;
}

.by{
  color:#777;
  font-size:8px;
  letter-spacing:3px;
}

.coins{
  background:#171323;
  border:1px solid #ffd21c55;
  border-radius:18px;
  padding:8px 13px;
  font-weight:bold;
}

.coins span{color:#ffd21c}

.back{
  background:#141426;
  border:1px solid #292941;
  color:#aaa;
  padding:8px 13px;
  border-radius:12px;
  margin-bottom:9px;
}

.card{
  background:#0e0e1b;
  border:1px solid #00d9ff30;
  border-radius:24px;
  padding:13px;
  box-shadow:0 20px 60px #0008;
}

.title{
  text-align:center;
  font-size:23px;
  font-weight:1000;
}

.subtitle{
  text-align:center;
  color:#77778c;
  font-size:10px;
  margin:3px 0 9px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
  margin-bottom:9px;
}

.stat{
  background:#090914;
  border:1px solid #202038;
  border-radius:12px;
  padding:7px 2px;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:16px;
}

.stat small{
  color:#66667b;
  font-size:7px;
}

.gameWrap{
  position:relative;
  width:min(92vw,430px);
  aspect-ratio:3/4;
  margin:auto;
}

canvas{
  width:100%;
  height:100%;
  display:block;
  border-radius:20px;
  border:2px solid #00eaff55;
  background:#070713;
  touch-action:none;
}

.overlay{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  border-radius:20px;
  background:#000c;
  backdrop-filter:blur(6px);
  z-index:20;
}

.overlay.show{display:flex}

.overlayBox{
  width:84%;
  max-width:320px;
  padding:24px;
  border-radius:22px;
  text-align:center;
  background:#141420;
  border:1px solid #343450;
  box-shadow:0 20px 60px #000;
}

.overlayIcon{font-size:50px}

.overlayTitle{
  font-size:26px;
  font-weight:1000;
  margin:5px 0;
}

.overlayText{
  color:#aaa;
  font-size:12px;
  line-height:1.5;
}

.reward{
  color:#ffd21c;
  font-weight:bold;
  margin:9px;
}

.controls{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin-top:9px;
}

.btn{
  border:0;
  border-radius:12px;
  padding:11px 4px;
  color:#fff;
  font-weight:900;
  background:linear-gradient(90deg,#008cff,#962cff);
}

.btn.secondary{
  background:#151527;
  border:1px solid #292941;
}

.hint{
  text-align:center;
  color:#888;
  font-size:10px;
  margin-top:8px;
}

.coinPop{
  position:fixed;
  color:#ffd21c;
  font-size:19px;
  font-weight:1000;
  pointer-events:none;
  animation:coinUp .7s forwards;
  z-index:50;
}

@keyframes coinUp{
  from{
    opacity:1;
    transform:translateY(0) scale(1);
  }
  to{
    opacity:0;
    transform:translateY(-55px) scale(1.3);
  }
}

.levelPop{
  position:fixed;
  left:50%;
  top:42%;
  transform:translate(-50%,-50%) scale(.7);
  color:#00eaff;
  font-size:32px;
  font-weight:1000;
  text-shadow:0 0 25px #00eaff;
  pointer-events:none;
  z-index:60;
  animation:levelPop .9s forwards;
}

@keyframes levelPop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}
  25%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}
  75%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1)}
}
</style>
</head>

<body>

<div class="app">

<div class="header">

<div>
<div class="logo">GAME ZONE</div>
<div class="by">BY DANISH</div>
</div>

<div class="coins">
🪙 <span id="coins">100</span>
</div>

</div>

<button class="back" onclick="goBack()">← Games</button>

<div class="card">

<div class="title">🎯 BOTTLE SHOOT</div>

<div class="subtitle">
Aim • Shoot • Survive • Level Up
</div>

<div class="stats">

<div class="stat">
<strong id="score">0</strong>
<small>SCORE</small>
</div>

<div class="stat">
<strong id="level">1/20</strong>
<small>LEVEL</small>
</div>

<div class="stat">
<strong id="ammo">8</strong>
<small>AMMO</small>
</div>

<div class="stat">
<strong id="time">30</strong>
<small>TIME</small>
</div>

</div>

<div class="gameWrap">

<canvas id="game"></canvas>

<div class="overlay" id="overlay">

<div class="overlayBox">

<div class="overlayIcon" id="overlayIcon">🎯</div>

<div class="overlayTitle" id="overlayTitle">
LEVEL COMPLETE
</div>

<div class="overlayText" id="overlayText">
Nice shot!
</div>

<div class="reward" id="reward">
+0 🪙
</div>

<button class="btn" id="overlayButton"
onclick="overlayAction()">
NEXT LEVEL
</button>

</div>

</div>

</div>

<div class="controls">

<button class="btn" onclick="restartLevel()">
🔄 RESTART
</button>

<button class="btn secondary" onclick="togglePause()">
⏸️ PAUSE
</button>

<button class="btn secondary" onclick="toggleSound()">
<span id="soundText">🔊 SOUND</span>
</button>

</div>

<div class="hint">
Tap anywhere on the game to fire 🎯
</div>

</div>

</div>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=0;
let H=0;

let level=1;
const MAX_LEVEL=20;

let score=0;
let ammo=8;
let timeLeft=30;

let running=true;
let paused=false;
let soundOn=true;

let coins=
Number(localStorage.getItem("gzd_coins")||100);

let bottles=[];
let bullets=[];
let particles=[];

let timer=null;
let lastTime=0;

let overlayMode="next";

const gun={
x:0,
y:0
};

const path={
left:.14,
right:.86,
top:.17,
bottom:.66,
radius:22
};

document.getElementById("coins").textContent=coins;

function resize(){

const rect=canvas.getBoundingClientRect();

W=Math.floor(rect.width);
H=Math.floor(rect.height);

canvas.width=W;
canvas.height=H;

gun.x=W/2;
gun.y=H*.50;

}

window.addEventListener("resize",resize);

/*
LEVEL CONFIG
*/

function levelConfig(l){

if(l===1)
return {
count:1,
danger:0,
ammo:7,
time:30,
speed:.055
};

if(l===2)
return {
count:2,
danger:0,
ammo:10,
time:30,
speed:.060
};

if(l===3)
return {
count:5,
danger:0,
ammo:15,
time:35,
speed:.065
};

if(l===4)
return {
count:3,
danger:1,
ammo:12,
time:30,
speed:.070
};

if(l<=7)
return {
count:3+l-4,
danger:0,
ammo:10+l,
time:35,
speed:.070+(l-4)*.006
};

if(l<=10)
return {
count:6+(l-8),
danger:0,
ammo:14,
time:35,
speed:.085+(l-8)*.007
};

if(l<=13)
return {
count:7+(l-11),
danger:1,
ammo:15,
time:35,
speed:.100+(l-11)*.007
};

if(l<=16)
return {
count:8+(l-14),
danger:1,
ammo:15,
time:32,
speed:.115+(l-14)*.008
};

if(l<=19)
return {
count:10+(l-17),
danger:2,
ammo:16,
time:32,
speed:.135+(l-17)*.008
};

return {
count:12,
danger:3,
ammo:17,
time:35,
speed:.165
};

}

/*
START LEVEL
*/

function startLevel(){

const cfg=levelConfig(level);

ammo=cfg.ammo;
timeLeft=cfg.time;

running=true;
paused=false;

bullets=[];
particles=[];

document.getElementById("level")
.textContent=level+"/"+MAX_LEVEL;

document.getElementById("ammo")
.textContent=ammo;

document.getElementById("time")
.textContent=timeLeft;

document.getElementById("overlay")
.classList.remove("show");

createBottles(cfg);

clearInterval(timer);

timer=setInterval(()=>{

if(!running||paused)return;

timeLeft--;

document.getElementById("time")
.textContent=timeLeft;

if(timeLeft<=0){

failLevel("TIME UP");

}

},1000);

showLevel(level);

}

/*
CREATE BOTTLES
*/

function createBottles(cfg){

bottles=[];

for(let i=0;i<cfg.count;i++){

const danger=
i<cfg.danger;

bottles.push({

t:(i/cfg.count)+Math.random()*.04,

speed:cfg.speed*(.85+Math.random()*.3),

danger:danger,

alive:true,

size:danger?27:24,

rotation:0

});

}

}

/*
PATH POINT
*/

function pathPoint(t){

t=((t%1)+1)%1;

const left=W*path.left;
const right=W*path.right;
const top=H*path.top;
const bottom=H*path.bottom;

const r=path.radius;

const straightW=right-left-2*r;
const straightH=bottom-top-2*r;

const curve=(Math.PI*r/2)*4;

const perimeter=
2*straightW+
2*straightH+
curve;

let d=t*perimeter;

/* top */

if(d<straightW){

return {
x:left+r+d,
y:top
};

}

d-=straightW;

/* top-right curve */

if(d<Math.PI*r/2){

const a=
-Math.PI/2+
d/r;

return {
x:right-r+r*Math.cos(a),
y:top+r+r*Math.sin(a)
};

}

d-=Math.PI*r/2;

/* right */

if(d<straightH){

return {
x:right,
y:top+r+d
};

}

d-=straightH;

/* bottom-right */

if(d<Math.PI*r/2){

const a=d/r;

return {
x:right-r+r*Math.cos(a),
y:bottom-r+r*Math.sin(a)
};

}

d-=Math.PI*r/2;

/* bottom */

if(d<straightW){

return {
x:right-r-d,
y:bottom
};

}

d-=straightW;

/* bottom-left */

if(d<Math.PI*r/2){

const a=
Math.PI/2+d/r;

return {
x:left+r+r*Math.cos(a),
y:bottom-r+r*Math.sin(a)
};

}

d-=Math.PI*r/2;

/* left */

if(d<straightH){

return {
x:left,
y:bottom-r-d
};

}

d-=straightH;

/* top-left */

const a=
Math.PI+d/r;

return {
x:left+r+r*Math.cos(a),
y:top+r+r*Math.sin(a)
};

}

/*
UPDATE
*/

function update(dt){

if(!running||paused)return;

const cfg=levelConfig(level);

bottles.forEach(b=>{

if(!b.alive)return;

b.t+=b.speed*dt;

b.rotation+=dt*1.5;

});

bullets.forEach(b=>{

b.x+=b.vx*dt;
b.y+=b.vy*dt;

b.life-=dt;

});

checkHits();

bullets=
bullets.filter(b=>
b.life>0 &&
b.x>-20 &&
b.x<W+20 &&
b.y>-20 &&
b.y<H+20
);

particles.forEach(p=>{

p.x+=p.vx*dt;
p.y+=p.vy*dt;

p.vy+=250*dt;

p.life-=dt;

});

particles=
particles.filter(p=>p.life>0);

}

/*
CHECK BULLET HITS
*/

function checkHits(){

for(let bi=bullets.length-1;bi>=0;bi--){

const bullet=bullets[bi];

for(let i=0;i<bottles.length;i++){

const b=bottles[i];

if(!b.alive)continue;

const p=pathPoint(b.t);

const distance=Math.hypot(
bullet.x-p.x,
bullet.y-p.y
);

if(distance<b.size+6){

bullets.splice(bi,1);

if(b.danger){

dangerHit();

return;

}

normalHit(b,p);

break;

}

}

}

}

/*
NORMAL HIT
*/

function normalHit(b,p){

b.alive=false;

score+=10;

coins++;

localStorage.setItem(
"gzd_coins",
coins
);

document.getElementById("score")
.textContent=score;

document.getElementById("coins")
.textContent=coins;

explode(p.x,p.y,false);

beep(850);

const remaining=
bottles.filter(x=>x.alive).length;

if(remaining===0){

completeLevel();

}

}

/*
DANGEROUS HIT
*/

function dangerHit(){

beep(120);

explode(
gun.x,
gun.y,
true
);

failLevel("💣 DANGER BOTTLE HIT");

}

/*
LEVEL COMPLETE
*/

function completeLevel(){

if(!running)return;

running=false;

clearInterval(timer);

const reward=
5+level*2;

coins+=reward;

localStorage.setItem(
"gzd_coins",
coins
);

document.getElementById("coins")
.textContent=coins;

if(level>=MAX_LEVEL){

finishGame();

return;

}

document.getElementById("overlayIcon")
.textContent="🏆";

document.getElementById("overlayTitle")
.textContent=
"LEVEL "+level+" COMPLETE";

document.getElementById("overlayText")
.textContent=
"All bottles destroyed!";

document.getElementById("reward")
.textContent=
"+"+reward+" 🪙";

document.getElementById("overlayButton")
.textContent=
"NEXT LEVEL →";

overlayMode="next";

document.getElementById("overlay")
.classList.add("show");

}

/*
FAIL LEVEL
*/

function failLevel(reason){

if(!running)return;

running=false;

clearInterval(timer);

document.getElementById("overlayIcon")
.textContent="💥";

document.getElementById("overlayTitle")
.textContent=
"LEVEL FAILED";

document.getElementById("overlayText")
.textContent=
reason+
". Try Level "+level+" again.";

document.getElementById("reward")
.textContent=
"Score: "+score;

document.getElementById("overlayButton")
.textContent=
"🔄 RETRY LEVEL";

overlayMode="retry";

document.getElementById("overlay")
.classList.add("show");

}

/*
FINAL
*/

function finishGame(){

document.getElementById("overlayIcon")
.textContent="👑";

document.getElementById("overlayTitle")
.textContent=
"ALL 20 LEVELS COMPLETE!";

document.getElementById("overlayText")
.textContent=
"You're the Bottle Shoot Champion!";

document.getElementById("reward")
.textContent=
"🏆 Final Score: "+score;

document.getElementById("overlayButton")
.textContent=
"🔄 PLAY AGAIN";

overlayMode="finish";

document.getElementById("overlay")
.classList.add("show");

}

/*
OVERLAY BUTTON
*/

function overlayAction(){

if(overlayMode==="next"){

level++;

startLevel();

return;

}

if(overlayMode==="retry"){

startLevel();

return;

}

if(overlayMode==="finish"){

level=1;
score=0;

document.getElementById("score")
.textContent=0;

startLevel();

}

}

/*
SHOOT
*/

function shoot(){

if(!running||paused)return;

if(ammo<=0){

failLevel("OUT OF AMMO");

return;

}

ammo--;

document.getElementById("ammo")
.textContent=ammo;

/*
Gun is in the CENTER of the path.
Automatically aims at the closest
active bottle.
*/

const target=
closestBottle();

if(!target)return;

const dx=target.x-gun.x;
const dy=target.y-gun.y;

const length=Math.hypot(dx,dy);

bullets.push({

x:gun.x,
y:gun.y,

vx:(dx/length)*900,
vy:(dy/length)*900,

life:1.2

});

beep(450);

}

/*
CLOSEST BOTTLE
*/

function closestBottle(){

let best=null;
let bestDistance=Infinity;

bottles.forEach(b=>{

if(!b.alive)return;

const p=pathPoint(b.t);

const d=Math.hypot(
p.x-gun.x,
p.y-gun.y
);

if(d<bestDistance){

bestDistance=d;
best={
b:b,
x:p.x,
y:p.y
};

}

});

return best;

}

/*
EXPLOSION
*/

function explode(x,y,danger){

for(let i=0;i<30;i++){

const a=
Math.random()*Math.PI*2;

const speed=
70+Math.random()*230;

particles.push({

x:x,
y:y,

vx:Math.cos(a)*speed,
vy:Math.sin(a)*speed,

life:.5+
Math.random()*.5,

size:2+
Math.random()*5,

danger:danger

});

}

}

/*
DRAW
*/

function draw(){

ctx.clearRect(0,0,W,H);

drawBackground();

drawPath();

drawBottles();

drawBullets();

drawGun();

drawParticles();

}

/*
BACKGROUND
*/

function drawBackground(){

ctx.fillStyle="#070713";

ctx.fillRect(
0,
0,
W,
H
);

ctx.strokeStyle=
"rgba(0,220,255,.045)";

for(let x=0;x<W;x+=30){

ctx.beginPath();

ctx.moveTo(x,0);
ctx.lineTo(x,H);

ctx.stroke();

}

for(let y=0;y<H;y+=30){

ctx.beginPath();

ctx.moveTo(0,y);
ctx.lineTo(W,y);

ctx.stroke();

}

}

/*
ROUNDED PATH
*/

function drawPath(){

const left=W*path.left;
const right=W*path.right;
const top=H*path.top;
const bottom=H*path.bottom;

ctx.save();

ctx.strokeStyle="#e9ffff";
ctx.lineWidth=5;

ctx.shadowBlur=15;
ctx.shadowColor="#00eaff";

ctx.beginPath();

ctx.roundRect(
left,
top,
right-left,
bottom-top,
path.radius
);

ctx.stroke();

ctx.restore();

}

/*
BOTTLES
*/

function drawBottles(){

bottles.forEach(b=>{

if(!b.alive)return;

const p=pathPoint(b.t);

drawBottle(
p.x,
p.y,
b.size,
b.danger,
b.rotation
);

});

}

function drawBottle(
x,
y,
size,
danger,
rotation
){

ctx.save();

ctx.translate(x,y);

ctx.rotate(rotation);

const s=size;

ctx.shadowBlur=
danger?25:18;

ctx.shadowColor=
danger?"#ff2727":"#00eaff";

/* body */

const g=
ctx.createLinearGradient(
-s,-s,
s,s
);

if(danger){

g.addColorStop(0,"#ff3b30");
g.addColorStop(.5,"#ff8a00");
g.addColorStop(1,"#8b0000");

}else{

g.addColorStop(0,"#00f6ff");
g.addColorStop(.5,"#008cff");
g.addColorStop(1,"#0040a0");

}

ctx.fillStyle=g;

ctx.beginPath();

ctx.roundRect(
-s*.55,
-s*.65,
s*1.1,
s*1.3,
8
);

ctx.fill();

/* neck */

ctx.shadowBlur=0;

ctx.fillStyle=
danger?"#ffb000":"#dfffff";

ctx.fillRect(
-s*.22,
-s*.95,
s*.44,
s*.34
);

/* cap */

ctx.fillStyle="#fff";

ctx.fillRect(
-s*.25,
-s*1.03,
s*.5,
s*.08
);

/* label */

ctx.fillStyle=
danger?"#350000":"#ff25b8";

ctx.fillRect(
-s*.48,
-s*.12,
s*.96,
s*.32
);

ctx.fillStyle="#fff";

ctx.font=
"bold "+Math.max(7,s*.23)+"px Arial";

ctx.textAlign="center";
ctx.textBaseline="middle";

ctx.fillText(
danger?"💣":"ZONE",
0,
s*.04
);

ctx.restore();

}

/*
BULLETS
*/

function drawBullets(){

bullets.forEach(b=>{

ctx.save();

ctx.fillStyle="#ffd21c";

ctx.shadowBlur=18;
ctx.shadowColor="#ff6b00";

ctx.beginPath();

ctx.arc(
b.x,
b.y,
5,
0,
Math.PI*2
);

ctx.fill();

ctx.restore();

});

}

/*
CENTRE GUN
*/

function drawGun(){

const target=
closestBottle();

let angle=-Math.PI/2;

if(target){

angle=Math.atan2(
target.y-gun.y,
target.x-gun.x
);

}

ctx.save();

ctx.translate(
gun.x,
gun.y
);

ctx.rotate(angle);

/* barrel */

ctx.shadowBlur=15;
ctx.shadowColor="#00eaff";

ctx.fillStyle="#d8d8d8";

ctx.fillRect(
-7,
-8,
60,
16
);

ctx.fillStyle="#777";

ctx.fillRect(
43,
-11,
20,
22
);

/* body */

ctx.shadowBlur=0;

ctx.fillStyle="#444";

ctx.beginPath();

ctx.roundRect(
-25,
-16,
30,
32,
8
);

ctx.fill();

/* grip */

ctx.fillStyle="#9b5b31";

ctx.beginPath();

ctx.roundRect(
-19,
12,
22,
42,
7
);

ctx.fill();

ctx.fillStyle="#5d321c";

ctx.fillRect(
-15,
22,
15,
25
);

ctx.restore();

}

/*
PARTICLES
*/

function drawParticles(){

particles.forEach(p=>{

ctx.save();

ctx.globalAlpha=
Math.max(0,p.life);

ctx.fillStyle=
p.danger?"#ff2d2d":"#ff25b8";

ctx.shadowBlur=12;

ctx.shadowColor=
p.danger?"#ff0000":"#ff25b8";

ctx.beginPath();

ctx.arc(
p.x,
p.y,
p.size,
0,
Math.PI*2
);

ctx.fill();

ctx.restore();

});

}

/*
PAUSE
*/

function togglePause(){

if(!running)return;

paused=!paused;

if(paused){

document.getElementById("overlayIcon")
.textContent="⏸️";

document.getElementById("overlayTitle")
.textContent="PAUSED";

document.getElementById("overlayText")
.textContent=
"Press PAUSE again to continue.";

document.getElementById("reward")
.textContent=
"Level "+level;

document.getElementById("overlayButton")
.textContent="CONTINUE";

overlayMode="pause";

document.getElementById("overlay")
.classList.add("show");

}else{

document.getElementById("overlay")
.classList.remove("show");

}

}

/*
SOUND
*/

function toggleSound(){

soundOn=!soundOn;

document.getElementById("soundText")
.textContent=
soundOn?
"🔊 SOUND":
"🔇 SOUND";

}

/*
SOUND ENGINE
*/

function beep(freq){

if(!soundOn)return;

try{

const AudioContext=
window.AudioContext||
window.webkitAudioContext;

const audio=
new AudioContext();

const osc=
audio.createOscillator();

const gain=
audio.createGain();

osc.connect(gain);
gain.connect(audio.destination);

osc.type="square";

osc.frequency.value=freq;

gain.gain.setValueAtTime(
.045,
audio.currentTime
);

gain.gain.exponentialRampToValueAtTime(
.001,
audio.currentTime+.12
);

osc.start();

osc.stop(
audio.currentTime+.12
);

}catch(e){}

}

/*
LEVEL POP
*/

function showLevel(l){

const el=
document.createElement("div");

el.className="levelPop";

el.textContent=
"LEVEL "+l;

document.body.appendChild(el);

setTimeout(
()=>el.remove(),
900
);

}

RESTART
*/

function restartLevel(){

startLevel();

}

BACK
*/

function goBack(){

window.location.href=
"index.html";

}

COIN POP
*/

function showCoin(){

const el=
document.createElement("div");

el.className="coinPop";

el.textContent="+1 🪙";

el.style.left="50%";
el.style.top="45%";

document.body.appendChild(el);

setTimeout(

700
);

}

/*
TAP = FIRE
*/

canvas.addEventListener(
"pointerdown",
e=>{

e.preventDefault();

shoot();

}
);

/*
PAUSE BUTTON OVERLAY
*/

document.getElementById("overlayButton")
.addEventListener("click",()=>{

if(overlayMode==="pause"){

paused=false;

document.getElementById("overlay")
.classList.remove("show");

}

});

/*
GAME LOOP
*/

function loop(t){

if(!lastTime)
lastTime=t;

const dt=
Math.min(
(t-lastTime)/1000,
.04
);

lastTime=t;

update(dt);
draw();

requestAnimationFrame(loop);

}

resize();

startLevel();

requestAnimationFrame(loop);

</script>
