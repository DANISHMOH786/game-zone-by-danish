<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#05050d">
<title>Bottle Shoot - Game Zone By Danish</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

body{
  min-height:100vh;
  font-family:Arial,sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at 15% 10%,#30116b,transparent 35%),
    radial-gradient(circle at 90% 80%,#002d68,transparent 35%),
    #05050d;
  overflow:hidden;
  touch-action:none;
}

.app{
  width:100%;
  max-width:520px;
  margin:auto;
  padding:15px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:11px;
}

.logo{
  font-size:23px;
  font-weight:1000;
  background:linear-gradient(90deg,#00eaff,#9c2cff,#ff24bd);
  -webkit-background-clip:text;
  color:transparent;
}

.by{
  font-size:9px;
  color:#777;
  letter-spacing:3px;
}

.coins{
  background:#171323;
  border:1px solid #ffd21c55;
  border-radius:18px;
  padding:8px 12px;
  font-weight:bold;
}

.coins span{
  color:#ffd21c;
}

.back{
  background:#141426;
  border:1px solid #292941;
  color:#aaa;
  padding:8px 12px;
  border-radius:12px;
  margin-bottom:10px;
}

.card{
  background:#0e0e1bdd;
  border:1px solid #00d9ff25;
  border-radius:24px;
  padding:14px;
  box-shadow:0 20px 60px #0008;
}

.title{
  text-align:center;
  font-size:22px;
  font-weight:1000;
}

.subtitle{
  text-align:center;
  color:#77778c;
  font-size:11px;
  margin:4px 0 10px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  margin-bottom:10px;
}

.stat{
  background:#090914;
  border:1px solid #202038;
  border-radius:12px;
  padding:7px 3px;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:16px;
}

.stat small{
  color:#66667b;
  font-size:7px;
}

.gameWrap{
  position:relative;
  width:min(92vw,400px);
  aspect-ratio:3/4;
  margin:auto;
}

canvas{
  width:100%;
  height:100%;
  display:block;
  border-radius:20px;
  border:1px solid #00eaff45;
  background:#070713;
  box-shadow:
    0 0 30px #00eaff15,
    inset 0 0 30px #00eaff08;
  cursor:crosshair;
}

.overlay{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  border-radius:20px;
  background:#000c;
  backdrop-filter:blur(6px);
  z-index:10;
}

.overlay.show{
  display:flex;
}

.overlayBox{
  text-align:center;
  padding:25px;
}

.overlayIcon{
  font-size:55px;
  animation:float .9s infinite alternate;
}

@keyframes float{
  to{transform:translateY(-7px)}
}

.overlayTitle{
  font-size:27px;
  font-weight:1000;
  margin:5px 0;
}

.reward{
  color:#ffd21c;
  font-weight:bold;
  margin:7px;
}

.newBest{
  color:#00eaff;
  font-size:12px;
  font-weight:bold;
  margin:5px;
}

.controls{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-top:10px;
}

.btn{
  border:0;
  border-radius:13px;
  padding:12px 4px;
  color:#fff;
  font-weight:900;
  background:linear-gradient(90deg,#008cff,#962cff);
  cursor:pointer;
}

.btn:active{
  transform:scale(.94);
}

.btn.secondary{
  background:#151527;
  border:1px solid #292941;
}

.sound{
  text-align:center;
  margin-top:9px;
}

.sound button{
  background:#111121;
  border:1px solid #28283e;
  color:#aaa;
  padding:7px 13px;
  border-radius:18px;
}

.hitText{
  position:fixed;
  color:#ffd21c;
  font-size:22px;
  font-weight:1000;
  pointer-events:none;
  z-index:50;
  animation:hit .7s forwards;
}

@keyframes hit{
  from{
    opacity:1;
    transform:translate(-50%,0) scale(.7);
  }
  to{
    opacity:0;
    transform:translate(-50%,-65px) scale(1.3);
  }
}

.muzzle{
  position:absolute;
  width:18px;
  height:18px;
  border-radius:50%;
  background:#fff;
  box-shadow:
    0 0 12px #fff,
    0 0 30px #00eaff;
  pointer-events:none;
  animation:muzzle .18s forwards;
  z-index:20;
}

@keyframes muzzle{
  to{
    opacity:0;
    transform:scale(3);
  }
}

</style>
</head>

<body>

<div class="app">

<div class="header">

<div>
<div class="logo">GAME ZONE</div>
<div class="by">BY DANISH</div>
</div>

<div class="coins">
🪙 <span id="coins">100</span>
</div>

</div>

<button class="back" onclick="goBack()">← Games</button>

<div class="card">

<div class="title">🎯 BOTTLE SHOOT</div>
<div class="subtitle">Aim • Shoot • Break</div>

<div class="stats">

<div class="stat">
<strong id="score">0</strong>
<small>SCORE</small>
</div>

<div class="stat">
<strong id="high">0</strong>
<small>BEST</small>
</div>

<div class="stat">
<strong id="shots">12</strong>
<small>SHOTS</small>
</div>

<div class="stat">
<strong id="time">30</strong>
<small>TIME</small>
</div>

</div>

<div class="gameWrap">

<canvas id="game"></canvas>

<div class="overlay" id="overlay">

<div class="overlayBox">

<div class="overlayIcon" id="overlayIcon">🎯</div>

<div class="overlayTitle" id="overlayTitle">
GAME OVER
</div>

<div id="finalScore">
Score: 0
</div>

<div class="reward" id="reward">
+0 🪙
</div>

<div class="newBest" id="newBest"></div>

<button class="btn" onclick="restart()">
🔄 PLAY AGAIN
</button>

</div>

</div>

</div>

<div class="controls">

<button class="btn" onclick="restart()">
🔄 RESTART
</button>

<button class="btn secondary" onclick="togglePause()">
⏸️ PAUSE
</button>

<button class="btn secondary" onclick="toggleSound()">
<span id="soundText">🔊 SOUND</span>
</button>

</div>

<div class="sound">
Tap anywhere on the game to shoot 🎯
</div>

</div>

</div>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=0;
let H=0;

let bottles=[];

let score=0;
let shots=12;
let timeLeft=30;

let high=Number(
localStorage.getItem("bottle_high")||0
);

let coins=Number(
localStorage.getItem("gzd_coins")||100
);

let running=true;
let paused=false;
let soundOn=true;

let timer=null;
let animation=null;

let lastTime=0;

document.getElementById("high").textContent=high;
document.getElementById("coins").textContent=coins;

function resize(){

const rect=canvas.getBoundingClientRect();

W=Math.floor(rect.width);
H=Math.floor(rect.height);

canvas.width=W;
canvas.height=H;

draw();

}

resize();

window.addEventListener("resize",resize);

function start(){

score=0;
shots=12;
timeLeft=30;

running=true;
paused=false;

document.getElementById("score").textContent=score;
document.getElementById("shots").textContent=shots;
document.getElementById("time").textContent=timeLeft;

document.getElementById("overlay").classList.remove("show");

createBottles();

clearInterval(timer);

timer=setInterval(()=>{

if(!running||paused)return;

timeLeft--;

document.getElementById("time").textContent=timeLeft;

if(timeLeft<=0){

gameOver("time");

}

},1000);

lastTime=performance.now();

cancelAnimationFrame(animation);

animation=requestAnimationFrame(loop);

}

function createBottles(){

bottles=[];

const count=4;

for(let i=0;i<count;i++){

bottles.push(makeBottle(i));

}

}

function makeBottle(index){

const radius=24;

return{

x:radius+Math.random()*(W-radius*2),

y:70+Math.random()*(H-150),

r:radius,

vx:(Math.random()>.5?1:-1)*
(45+Math.random()*55),

vy:(Math.random()>.5?1:-1)*
(15+Math.random()*30),

alive:true,

rotation:Math.random()*Math.PI*2,

rotSpeed:(Math.random()-.5)*1.5,

hue:index

};

}

function loop(now){

if(!running){

draw();

return;

}

const dt=Math.min(
(now-lastTime)/1000,
.04
);

lastTime=now;

if(!paused){

update(dt);

}

draw();

animation=requestAnimationFrame(loop);

}

function update(dt){

bottles.forEach(b=>{

if(!b.alive)return;

b.x+=b.vx*dt;
b.y+=b.vy*dt;

b.rotation+=b.rotSpeed*dt;

if(b.x-b.r<0){

b.x=b.r;
b.vx=Math.abs(b.vx);

}

if(b.x+b.r>W){

b.x=W-b.r;
b.vx=-Math.abs(b.vx);

}

if(b.y-b.r<55){

b.y=55+b.r;
b.vy=Math.abs(b.vy);

}

if(b.y+b.r>H-30){

b.y=H-30-b.r;
b.vy=-Math.abs(b.vy);

}

});

}

function draw(){

ctx.clearRect(0,0,W,H);

drawBackground();

bottles.forEach(
b=>drawBottle(b)
);

drawCrosshair();

}

function drawBackground(){

const gradient=
ctx.createLinearGradient(
0,0,0,H
);

gradient.addColorStop(0,"#08081a");
gradient.addColorStop(.5,"#060b19");
gradient.addColorStop(1,"#03040b");

ctx.fillStyle=gradient;

ctx.fillRect(0,0,W,H);

ctx.strokeStyle="rgba(0,220,255,.04)";

for(let x=0;x<W;x+=35){

ctx.beginPath();

ctx.moveTo(x,0);
ctx.lineTo(x,H);

ctx.stroke();

}

for(let y=0;y<H;y+=35){

ctx.beginPath();

ctx.moveTo(0,y);
ctx.lineTo(W,y);

ctx.stroke();

}

}

function drawBottle(b){

if(!b.alive)return;

ctx.save();

ctx.translate(b.x,b.y);

ctx.rotate(b.rotation);

const r=b.r;

ctx.shadowBlur=14;
ctx.shadowColor="#00eaff";

const body=
ctx.createLinearGradient(
-r,0,r,0
);

body.addColorStop(0,"#065c72");
body.addColorStop(.45,"#27eaff");
body.addColorStop(1,"#063b65");

ctx.fillStyle=body;

ctx.beginPath();

ctx.roundRect(
-r*.65,
-r*.65,
r*1.3,
r*1.5,
r*.3
);

ctx.fill();

ctx.shadowBlur=0;

ctx.fillStyle="#9cffff";

ctx.beginPath();

ctx.roundRect(
-r*.32,
-r*1.15,
r*.64,
r*.55,
r*.12
);

ctx.fill();

ctx.fillStyle="#ff2ca8";

ctx.beginPath();

ctx.roundRect(
-r*.58,
-r*.05,
r*1.16,
r*.42,
r*.08
);

ctx.fill();

ctx.fillStyle="#fff";

ctx.font="bold 9px Arial";

ctx.textAlign="center";

ctx.fillText(
"ZONE",
0,
r*.22
);

ctx.restore();

}

function drawCrosshair(){

/*
The actual crosshair follows the last
pointer/touch position.
*/

if(!pointer.active)return;

const x=pointer.x;
const y=pointer.y;

ctx.strokeStyle="#00eaff";
ctx.lineWidth=2;

ctx.shadowBlur=10;
ctx.shadowColor="#00eaff";

ctx.beginPath();

ctx.arc(
x,
y,
18,
0,
Math.PI*2
);

ctx.stroke();

ctx.beginPath();

ctx.moveTo(x-27,y);
ctx.lineTo(x-8,y);

ctx.moveTo(x+8,y);
ctx.lineTo(x+27,y);

ctx.moveTo(x,y-27);
ctx.lineTo(x,y-8);

ctx.moveTo(x,y+8);
ctx.lineTo(x,y+27);

ctx.stroke();

ctx.shadowBlur=0;

}

const pointer={
x:0,
y:0,
active:false
};

function pointerPosition(e){

const rect=canvas.getBoundingClientRect();

let clientX;
let clientY;

if(e.touches&&e.touches.length){

clientX=e.touches[0].clientX;
clientY=e.touches[0].clientY;

}else{

clientX=e.clientX;
clientY=e.clientY;

}

pointer.x=clientX-rect.left;
pointer.y=clientY-rect.top;
pointer.active=true;

}

canvas.addEventListener(
"pointermove",
e=>{

pointerPosition(e);
draw();

}
);

canvas.addEventListener(
"pointerdown",
e=>{

pointerPosition(e);

shoot(
pointer.x,
pointer.y
);

}
);

canvas.addEventListener(
"touchstart",
e=>{

pointerPosition(e);

shoot(
pointer.x,
pointer.y
);

},
{passive:true}
);

function shoot(x,y){

if(!running||paused)return;

if(shots<=0)return;

shots--;

document.getElementById("shots").textContent=shots;

muzzleFlash(x,y);

beep("shoot");

let hit=false;

for(let i=bottles.length-1;i>=0;i--){

const b=bottles[i];

if(!b.alive)continue;

const dx=x-b.x;
const dy=y-b.y;

const distance=Math.sqrt(
dx*dx+dy*dy
);

if(distance<=b.r+8){

b.alive=false;

score+=10;

coins+=1;

localStorage.setItem(
"gzd_coins",
coins
);

document.getElementById("coins").textContent=coins;

document.getElementById("score").textContent=score;

showHit(b.x,b.y);

beep("break");

hit=true;

setTimeout(()=>{

if(running){

bottles[
Math.floor(Math.random()*bottles.length)
]=makeBottle(
Math.floor(Math.random()*4)
);

}

},250);

break;

}

}

if(!hit){

showMiss(x,y);

}

if(score>high){

high=score;

localStorage.setItem(
"bottle_high",
high
);

document.getElementById("high").textContent=high;

}

if(shots<=0){

setTimeout(
()=>gameOver("shots"),
450
);

}

}

function muzzleFlash(x,y){

const el=
document.createElement("div");

el.className="muzzle";

el.style.left=
(x-9)+"px";

el.style.top=
(y-9)+"px";

document.querySelector(".gameWrap")
.appendChild(el);

setTimeout(
()=>el.remove(),
200
);

}

function showHit(x,y){

const rect=canvas.getBoundingClientRect();

const el=
document.createElement("div");

el.className="hitText";

el.textContent="+10";

el.style.left=
(rect.left+x)+"px";

el.style.top=
(rect.top+y)+"px";

document.body.appendChild(el);

setTimeout(
()=>el.remove(),
700
);

}

function showMiss(x,y){

const rect=canvas.getBoundingClientRect();

const el=
document.createElement("div");

el.className="hitText";

el.style.color="#777";

el.textContent="MISS";

el.style.left=
(rect.left+x)+"px";

el.style.top=
(rect.top+y)+"px";

document.body.appendChild(el);

setTimeout(
()=>el.remove(),
700
);

}

function gameOver(reason){

if(!running)return;

running=false;

clearInterval(timer);
cancelAnimationFrame(animation);

const reward=
Math.floor(score/10);

coins+=reward;

localStorage.setItem(
"gzd_coins",
coins
);

document.getElementById("coins").textContent=coins;

document.getElementById("finalScore").textContent=
"Score: "+score;

document.getElementById("reward").textContent=
"+"+reward+" 🪙";

document.getElementById("newBest").textContent=
score>=high&&score>0
?"🏆 NEW HIGH SCORE!"
:"";

document.getElementById("overlayIcon").textContent=
reason==="time"?"⏰":"💥";

document.getElementById("overlayTitle").textContent=
reason==="time"
?"TIME UP!"
:"OUT OF SHOTS";

document.getElementById("overlay").classList.add("show");

beep("lose");

}

function restart(){

start();

}

function togglePause(){

if(!running)return;

paused=!paused;

const overlay=
document.getElementById("overlay");

if(paused){

overlay.classList.add("show");

document.getElementById("overlayIcon").textContent="⏸️";

document.getElementById("overlayTitle").textContent="PAUSED";

document.getElementById("finalScore").textContent=
"Score: "+score;

document.getElementById("reward").textContent=
"Tap PLAY AGAIN to restart";

document.getElementById("newBest").textContent="";

}else{

overlay.classList.remove("show");

}

}

function toggleSound(){

soundOn=!soundOn;

document.getElementById("soundText").textContent=
soundOn
?"🔊 SOUND"
:"🔇 SOUND";

if(soundOn)beep("tap");

}

function beep(type){

if(!soundOn)return;

try{

const audio=
new(window.AudioContext||window.webkitAudioContext)();

const osc=
audio.createOscillator();

const gain=
audio.createGain();

osc.connect(gain);

gain.connect(audio.destination);

osc.type="sine";

let start=500;
let end=700;

if(type==="shoot"){

start=180;
end=90;

}

if(type==="break"){

start=650;
end=1100;

}

if(type==="lose"){

start=300;
end=100;

}

osc.frequency.setValueAtTime(
start,
audio.currentTime
);

osc.frequency.exponentialRampToValueAtTime(
end,
audio.currentTime+.16
);

gain.gain.setValueAtTime(
.07,
audio.currentTime
);

gain.gain.exponentialRampToValueAtTime(
.001,
audio.currentTime+.18
);

osc.start();

osc.stop(
audio.currentTime+.18
);

}catch(e){}

}

function goBack(){

window.location.href="index.html";

}

start();

</script>

</body>
</html>
