<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111111">
<title>Bottle Shoot - Game Zone By Danish</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  font-family:Arial,sans-serif;
  touch-action:none;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

#game{
  position:relative;
  width:100vw;
  max-width:520px;
  height:100vh;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 55%,#292929 0,#1d1d1d 48%,#111 100%);
}

/* TOP */

.top{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:62px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 15px;
  z-index:20;
}

.back{
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:#222;
  color:white;
  font-size:27px;
}

.coin{
  background:#222;
  border:1px solid #ffd21c55;
  padding:8px 13px;
  border-radius:20px;
  color:#ffd21c;
  font-weight:bold;
}

/* TITLE */

.title{
  position:absolute;
  top:72px;
  left:0;
  width:100%;
  text-align:center;
  z-index:10;
  color:white;
  font-size:27px;
  font-weight:1000;
  letter-spacing:1px;
  text-shadow:3px 3px #000;
}

.subtitle{
  position:absolute;
  top:105px;
  width:100%;
  text-align:center;
  color:#aaa;
  font-size:10px;
  letter-spacing:2px;
  z-index:10;
}

/* PATH */

.path{
  position:absolute;
  left:12%;
  right:12%;
  top:135px;
  bottom:205px;
  border:7px solid #eeeeee;
  border-radius:45px;
  box-shadow:
    0 0 5px #fff,
    inset 0 0 10px #000;
}

/* BOTTLE */

.bottle{
  position:absolute;
  width:52px;
  height:88px;
  z-index:8;
  transform-origin:center;
}

.bottleBody{
  position:absolute;
  left:6px;
  top:20px;
  width:40px;
  height:62px;
  border-radius:10px 10px 14px 14px;
  background:
    linear-gradient(90deg,#075a21,#2ee65c,#075a21);
  border:3px solid #75ff8d;
  box-shadow:
    0 0 15px #22ff5c66,
    inset 0 0 10px #0008;
}

.bottleNeck{
  position:absolute;
  left:16px;
  top:3px;
  width:20px;
  height:28px;
  border-radius:7px 7px 3px 3px;
  background:linear-gradient(
    90deg,
    #064b1b,
    #48ef69,
    #064b1b
  );
  border:3px solid #72ff88;
  z-index:2;
}

.bottleCap{
  position:absolute;
  left:16px;
  top:0;
  width:20px;
  height:8px;
  border-radius:4px;
  background:#aaa;
  z-index:4;
}

.bottleLabel{
  position:absolute;
  left:10px;
  top:42px;
  width:32px;
  height:20px;
  background:#151515;
  border:2px solid #8cff9a;
  z-index:4;
}

/* GUN */

.gun{
  position:absolute;
  left:50%;
  bottom:112px;
  width:145px;
  height:90px;
  transform-origin:18px 45px;
  z-index:15;
  pointer-events:none;
}

.barrel{
  position:absolute;
  left:15px;
  top:30px;
  width:95px;
  height:20px;
  border-radius:12px 4px 4px 12px;
  background:linear-gradient(#ddd,#777,#ddd);
  border:2px solid #333;
}

.barrel2{
  position:absolute;
  left:90px;
  top:34px;
  width:42px;
  height:12px;
  background:#aaa;
  border:2px solid #333;
}

.handle{
  position:absolute;
  left:18px;
  top:48px;
  width:42px;
  height:52px;
  border-radius:5px 8px 15px 12px;
  background:linear-gradient(
    90deg,
    #5d2c0e,
    #b96c2d,
    #5d2c0e
  );
  transform:rotate(-18deg);
  border:3px solid #3b1b08;
}

.trigger{
  position:absolute;
  left:27px;
  top:49px;
  width:15px;
  height:20px;
  border:3px solid #222;
  border-top:0;
  border-radius:0 0 10px 10px;
}

.muzzle{
  position:absolute;
  left:127px;
  top:29px;
  width:25px;
  height:22px;
  border-radius:50%;
  background:#222;
  border:3px solid #777;
}

/* BULLET */

.bullet{
  position:absolute;
  width:9px;
  height:9px;
  border-radius:50%;
  background:#ffd21c;
  box-shadow:
    0 0 8px #fff,
    0 0 18px #ff9d00;
  z-index:14;
}

/* UI */

.hud{
  position:absolute;
  left:50%;
  bottom:35px;
  transform:translateX(-50%);
  display:flex;
  gap:20px;
  align-items:center;
  z-index:20;
}

.score{
  color:white;
  font-size:38px;
  font-weight:1000;
  text-shadow:3px 3px #000;
}

.bullets{
  display:flex;
  gap:4px;
}

.bulletIcon{
  width:8px;
  height:22px;
  border-radius:5px 5px 2px 2px;
  background:#ffd21c;
  box-shadow:0 0 5px #ffd21c;
}

/* FIRE */

.flash{
  position:absolute;
  width:35px;
  height:35px;
  border-radius:50%;
  background:#fff;
  box-shadow:
    0 0 15px #fff,
    0 0 35px #ff9d00;
  z-index:30;
  pointer-events:none;
}

/* HIT */

.hit{
  position:absolute;
  color:#ffd21c;
  font-size:26px;
  font-weight:1000;
  z-index:40;
  pointer-events:none;
  animation:hit .65s forwards;
}

@keyframes hit{
  from{
    opacity:1;
    transform:translate(-50%,0) scale(.6);
  }
  to{
    opacity:0;
    transform:translate(-50%,-70px) scale(1.4);
  }
}

/* OVERLAY */

.overlay{
  position:absolute;
  inset:0;
  background:#000b;
  display:none;
  align-items:center;
  justify-content:center;
  z-index:50;
}

.overlay.show{
  display:flex;
}

.box{
  width:82%;
  max-width:330px;
  padding:28px;
  border-radius:25px;
  text-align:center;
  background:#191919;
  border:2px solid #555;
  box-shadow:0 15px 60px #000;
}

.big{
  font-size:50px;
}

.box h2{
  color:white;
  font-size:28px;
  margin:8px;
}

.box p{
  color:#bbb;
}

.reward{
  color:#ffd21c!important;
  font-weight:bold;
  margin:12px;
}

.play{
  width:100%;
  border:0;
  padding:14px;
  border-radius:14px;
  color:white;
  font-weight:1000;
  font-size:15px;
  background:linear-gradient(90deg,#008cff,#a42cff);
}

/* MISSION BANNER */

.banner{
  position:absolute;
  top:132px;
  left:-8%;
  width:116%;
  height:62px;
  background:#eee;
  transform:rotate(-4deg);
  z-index:5;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#050505;
  font-size:22px;
  font-weight:1000;
  letter-spacing:1px;
  box-shadow:0 4px 8px #0008;
}

/* Hide banner after starting */
.banner.hide{
  opacity:0;
  pointer-events:none;
}

@media(max-height:700px){

.title{
  top:62px;
}

.subtitle{
  top:94px;
}

.path{
  top:120px;
  bottom:175px;
}

.gun{
  bottom:88px;
}

.hud{
  bottom:18px;
}

}
</style>
</head>

<body>

<div id="game">

<div class="top">

<button class="back" onclick="goBack()">‹</button>

<div class="coin">
🪙 <span id="coins">100</span>
</div>

</div>

<div class="title">BOTTLE SHOOT</div>

<div class="subtitle">
AIM • SHOOT • BREAK
</div>

<div class="banner" id="banner">
CHALLENGING MISSIONS
</div>

<div class="path" id="path"></div>

<div class="bottle" id="bottle">

<div class="bottleNeck"></div>
<div class="bottleCap"></div>
<div class="bottleBody"></div>
<div class="bottleLabel"></div>

</div>

<div class="gun" id="gun">

<div class="barrel"></div>
<div class="barrel2"></div>
<div class="handle"></div>
<div class="trigger"></div>
<div class="muzzle"></div>

</div>

<div class="hud">

<div class="score" id="score">00</div>

<div class="bullets" id="bulletBox">
<div class="bulletIcon"></div>
<div class="bulletIcon"></div>
<div class="bulletIcon"></div>
<div class="bulletIcon"></div>
<div class="bulletIcon"></div>
<div class="bulletIcon"></div>
</div>

</div>

<div class="overlay" id="overlay">

<div class="box">

<div class="big">💥</div>

<h2>MISSION OVER</h2>

<p id="finalScore">Score: 0</p>

<p class="reward" id="reward">
+0 🪙
</p>

<button class="play" onclick="restart()">
🔄 PLAY AGAIN
</button>

</div>

</div>

</div>

<script>

const game=document.getElementById("game");
const bottle=document.getElementById("bottle");
const gun=document.getElementById("gun");

const scoreEl=document.getElementById("score");
const coinEl=document.getElementById("coins");
const bulletBox=document.getElementById("bulletBox");

let score=0;
let shots=6;
let coins=Number(
localStorage.getItem("gzd_coins")||100
);

let running=true;

let bottleProgress=0;
let bottleSpeed=.00010;

let lastTime=performance.now();

let pathPoints=[];

coinEl.textContent=coins;

/*
Create one continuous rounded path.
Bottle follows this path in one direction.
*/

function buildPath(){

const w=game.clientWidth;
const h=game.clientHeight;

const left=w*.15;
const right=w*.85;
const top=h*.19;
const bottom=h*.68;

const r=Math.min(55,(right-left)*.12);

pathPoints=[];

/* top straight */

for(let i=0;i<=30;i++){

const t=i/30;

pathPoints.push({
x:left+r+(right-left-r*2)*t,
y:top
});

}

/* right curve */

for(let i=1;i<=15;i++){

const a=-Math.PI/2+
(Math.PI/2)*(i/15);

pathPoints.push({
x:right-r+r*Math.cos(a),
y:top+r+r*Math.sin(a)
});

}

/* right straight */

for(let i=1;i<=25;i++){

const t=i/25;

pathPoints.push({
x:right,
y:top+r+(bottom-top-r*2)*t
});

}

/* bottom-right curve */

for(let i=1;i<=15;i++){

const a=
0+
(Math.PI/2)*(i/15);

pathPoints.push({
x:right-r+r*Math.cos(a),
y:bottom-r+r*Math.sin(a)
});

}

/* bottom straight */

for(let i=1;i<=30;i++){

const t=i/30;

pathPoints.push({
x:right-r-(right-left-r*2)*t,
y:bottom
});

}

/* bottom-left curve */

for(let i=1;i<=15;i++){

const a=
Math.PI/2+
(Math.PI/2)*(i/15);

pathPoints.push({
x:left+r+r*Math.cos(a),
y:bottom-r+r*Math.sin(a)
});

}

/* left straight */

for(let i=1;i<=25;i++){

const t=i/25;

pathPoints.push({
x:left,
y:bottom-r-(bottom-top-r*2)*t
});

}

/* top-left curve */

for(let i=1;i<=15;i++){

const a=
Math.PI+
(Math.PI/2)*(i/15);

pathPoints.push({
x:left+r+r*Math.cos(a),
y:top+r+r*Math.sin(a)
});

}

}

/*
Place bottle on path.
*/

function updateBottle(){

if(!pathPoints.length)return;

const index=
Math.floor(
bottleProgress*pathPoints.length
)%pathPoints.length;

const nextIndex=
(index+1)%pathPoints.length;

const p=pathPoints[index];
const n=pathPoints[nextIndex];

bottle.style.left=
(p.x-26)+"px";

bottle.style.top=
(p.y-44)+"px";

const angle=
Math.atan2(
n.y-p.y,
n.x-p.x
)*180/Math.PI;

bottle.style.transform=
"rotate("+angle+"deg)";

}

/*
Animation
*/

function loop(now){

if(running){

const dt=
now-lastTime;

bottleProgress+=
dt*bottleSpeed;

if(bottleProgress>=1)
bottleProgress-=1;

updateBottle();

}

lastTime=now;

requestAnimationFrame(loop);

}

/*
Gun aim.
*/

function aimGun(x,y){

const rect=
game.getBoundingClientRect();

const gx=
rect.width/2;

const gy=
rect.height-150;

const dx=x-gx;
const dy=y-gy;

const angle=
Math.atan2(dy,dx)*180/Math.PI;

gun.style.left=
"calc(50% - 18px)";

gun.style.transform=
"rotate("+angle+"deg)";

}

/*
Tap / click.
*/

game.addEventListener(
"pointerdown",
function(e){

if(!running)return;

const rect=
game.getBoundingClientRect();

const x=
e.clientX-rect.left;

const y=
e.clientY-rect.top;

aimGun(x,y);

fire(x,y);

}
);

/*
Fire bullet toward tap.
*/

function fire(tx,ty){

if(shots<=0)return;

shots--;

updateBullets();

const rect=
game.getBoundingClientRect();

const startX=
rect.width/2+110;

const startY=
rect.height-155;

const dx=tx-startX;
const dy=ty-startY;

const length=
Math.sqrt(dx*dx+dy*dy);

const vx=dx/length;
const vy=dy/length;

const bullet=
document.createElement("div");

bullet.className="bullet";

bullet.style.left=
(startX-4)+"px";

bullet.style.top=
(startY-4)+"px";

game.appendChild(bullet);

const speed=16;

let x=startX;
let y=startY;

function move(){

x+=vx*speed;
y+=vy*speed;

bullet.style.left=
(x-4)+"px";

bullet.style.top=
(y-4)+"px";

/*
Check bottle collision.
*/

const br=
bottle.getBoundingClientRect();

const gr=
game.getBoundingClientRect();

const bx=
br.left-gr.left+
br.width/2;

const by=
br.top-gr.top+
br.height/2;

const distance=
Math.hypot(x-bx,y-by);

if(distance<42){

hitBottle(
bx,
by,
bullet
);

return;

}

if(
x<-20||
x>rect.width+20||
y<-20||
y>rect.height+20
){

bullet.remove();

return;

}

requestAnimationFrame(move);

}

move();

flash(tx,ty);

}

/*
Bottle hit.
*/

function hitBottle(x,y,bullet){

bullet.remove();

score+=10;

scoreEl.textContent=
String(score).padStart(2,"0");

coins++;

localStorage.setItem(
"gzd_coins",
coins
);

coinEl.textContent=coins;

showHit(x,y);

/*
Move bottle immediately to another
position on the same path.
*/

bottleProgress+=.15;

if(bottleProgress>=1)
bottleProgress-=1;

updateBottle();

}

/*
Fire flash.
*/

function flash(x,y){

const el=
document.createElement("div");

el.className="flash";

el.style.left=
(x-17)+"px";

el.style.top=
(y-17)+"px";

game.appendChild(el);

setTimeout(
()=>el.remove(),
150
);

}

/*
Hit text.
*/

function showHit(x,y){

const el=
document.createElement("div");

el.className="hit";

el.textContent="+10";

el.style.left=x+"px";
el.style.top=y+"px";

game.appendChild(el);

setTimeout(
()=>el.remove(),
650
);

}

/*
Bullets UI.
*/

function updateBullets(){

bulletBox.innerHTML="";

for(let i=0;i<shots;i++){

const b=
document.createElement("div");

b.className="bulletIcon";

bulletBox.appendChild(b);

}

if(shots<=0){

setTimeout(gameOver,500);

}

}

/*
Game over.
*/

function gameOver(){

if(!running)return;

running=false;

const reward=
Math.floor(score/10);

coins+=reward;

localStorage.setItem(
"gzd_coins",
coins
);

coinEl.textContent=coins;

document.getElementById(
"finalScore"
).textContent=
"Score: "+score;

document.getElementById(
"reward"
).textContent=
"+"+reward+" 🪙";

document.getElementById(
"overlay"
).classList.add("show");

}

/*
Restart.
*/

function restart(){

score=0;
shots=6;
running=true;
bottleProgress=0;

scoreEl.textContent="00";

updateBullets();

document.getElementById(
"overlay"
).classList.remove("show");

document.getElementById(
"banner"
).classList.remove("hide");

setTimeout(()=>{

document.getElementById(
"banner"
).classList.add("hide");

},1000);

updateBottle();

}

/*
Back.
*/

function goBack(){

window.location.href="index.html";

}

/*
Resize.
*/

function resize(){

buildPath();

updateBottle();

}

window.addEventListener(
"resize",
resize
);

buildPath();
updateBottle();
updateBullets();

setTimeout(()=>{

document.getElementById(
"banner"
).classList.add("hide");

},1800);

requestAnimationFrame(loop);

</script>

</body>
</html>
