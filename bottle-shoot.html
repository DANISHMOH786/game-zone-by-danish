<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#05050d">
<title>Bottle Shoot - Game Zone By Danish</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;min-height:100%;background:#05050d;color:#fff;font-family:Arial,sans-serif}
body{overflow-x:hidden}.app{width:min(100%,900px);margin:auto;padding:14px}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.logo{font-size:24px;font-weight:1000;background:linear-gradient(90deg,#00eaff,#9c2cff,#ff24bd);-webkit-background-clip:text;color:transparent}
.by{font-size:9px;color:#777;letter-spacing:3px}.coins{padding:8px 13px;border:1px solid #ffd21c66;background:#171323;border-radius:20px;font-weight:900}
.coins span{color:#ffd21c}.back,.btn{border:0;color:#fff;font-weight:900;border-radius:13px;padding:10px 14px;cursor:pointer}
.back{background:#141426;border:1px solid #292941;margin-bottom:10px}.card{background:#0d0d19ee;border:1px solid #00d9ff30;border-radius:24px;padding:14px;box-shadow:0 20px 70px #0009}
.title{text-align:center;font-size:25px;font-weight:1000}.subtitle{text-align:center;color:#77778c;font-size:11px;margin:4px 0 12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}.stat{background:#090914;border:1px solid #202038;border-radius:14px;padding:8px;text-align:center}
.stat strong{display:block;font-size:18px}.stat small{font-size:8px;color:#66667b}
.gameWrap{position:relative;width:min(94vw,760px);margin:auto}canvas{display:block;width:100%;aspect-ratio:1/1;border-radius:22px;border:2px solid #00eaff55;background:#050812;box-shadow:0 0 35px #00eaff15;touch-action:none}
.overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;border-radius:22px;background:#000b;backdrop-filter:blur(5px)}.overlay.show{display:flex}
.overlayBox{text-align:center;padding:25px}.overlayIcon{font-size:50px}.overlayTitle{font-size:28px;font-weight:1000;margin:5px 0}.reward{color:#ffd21c;font-weight:900;margin:8px}
.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.btn{background:linear-gradient(90deg,#008cff,#962cff);font-size:14px}.btn.secondary{background:#151527;border:1px solid #292941}
.hint{text-align:center;color:#77778c;font-size:11px;margin-top:9px}
@media(max-width:520px){.app{padding:9px}.card{padding:10px;border-radius:20px}.title{font-size:21px}.stats{gap:5px}.stat{padding:7px 3px}.stat strong{font-size:16px}.controls .btn{padding:10px 4px;font-size:12px}}
</style>
</head>
<body>
<div class="app">
<div class="header"><div><div class="logo">GAME ZONE</div><div class="by">BY DANISH</div></div><div class="coins">🪙 <span id="coins">100</span></div></div>
<button class="back" onclick="goBack()">← Games</button>
<div class="card">
<div class="title">🎯 BOTTLE SHOOT</div><div class="subtitle">Aim • Shoot • Survive • Level Up</div>
<div class="stats"><div class="stat"><strong id="score">0</strong><small>SCORE</small></div><div class="stat"><strong id="level">1/20</strong><small>LEVEL</small></div><div class="stat"><strong id="ammo">5</strong><small>AMMO</small></div><div class="stat"><strong id="time">35</strong><small>TIME</small></div></div>
<div class="gameWrap"><canvas id="game"></canvas><div class="overlay" id="overlay"><div class="overlayBox"><div class="overlayIcon" id="overlayIcon">💥</div><div class="overlayTitle" id="overlayTitle">GAME OVER</div><div id="overlayText"></div><div class="reward" id="reward"></div><button class="btn" onclick="restart()">🔄 PLAY AGAIN</button></div></div></div>
<div class="controls"><button class="btn" onclick="restart()">🔄 RESTART</button><button class="btn secondary" onclick="togglePause()">⏸️ PAUSE</button><button class="btn secondary" onclick="toggleSound()"><span id="soundText">🔊 SOUND</span></button></div>
<div class="hint">Tap anywhere → gun smoothly points and fires. Shoot GREEN bottles. Avoid RED ☠ bottles!</div>
</div></div>

<script>
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
const W=1000,H=1000;canvas.width=W;canvas.height=H;
const TOTAL=20;
const D={
1:[1,0,5,35,.055],2:[2,0,7,38,.060],3:[5,0,12,42,.065],4:[3,1,10,42,.070],
5:[4,1,12,42,.073],6:[5,1,13,44,.076],7:[5,2,14,45,.079],8:[6,1,15,45,.082],
9:[6,2,16,46,.085],10:[7,2,17,46,.088],11:[7,2,18,47,.091],12:[8,2,19,47,.094],
13:[8,3,20,48,.097],14:[9,3,21,48,.100],15:[9,3,22,49,.103],16:[10,3,23,49,.106],
17:[10,4,24,50,.109],18:[11,4,25,50,.112],19:[12,4,27,52,.115],20:[14,5,30,55,.118]
};
const P={x:125,y:145,w:750,h:710,r:105};
const straightA=P.w-2*P.r,straightB=P.h-2*P.r,arc=Math.PI*P.r/2;
const LEN=2*straightA+2*straightB+4*arc;

let score=0,level=1,ammo=5,timeLeft=35,running=true,paused=false,soundOn=true;
let bottles=[],bullets=[],particles=[],aimAngle=-Math.PI/2,targetAngle=-Math.PI/2,last=0,msg="",audio=null;
let flashTime=0;
let coins=Number(localStorage.getItem("gzd_coins")||100);document.getElementById("coins").textContent=coins;

if (!ctx.roundRect) {
  ctx.roundRect = function(x, y, w, h, r) {
    if (typeof r === 'number') r = [r, r, r, r];
    this.beginPath();this.moveTo(x + r[0], y);
    this.lineTo(x + w - r[1], y);this.quadraticCurveTo(x + w, y, x + w, y + r[1]);
    this.lineTo(x + w, y + h - r[2]);this.quadraticCurveTo(x + w, y + h, x + w - r[2], y + h);
    this.lineTo(x + r[3], y + h);this.quadraticCurveTo(x, y + h, x, y + h - r[3]);
    this.lineTo(x, y + r[0]);this.quadraticCurveTo(x, y, x + r[0], y);this.closePath();
  };
}

function point(t){
 t=((t%LEN)+LEN)%LEN;const x=P.x,y=P.y,w=P.w,h=P.h,r=P.r;
 if(t<straightA)return{x:x+r+t,y,ang:0};t-=straightA;
 if(t<arc){let a=-Math.PI/2+t/r;return{x:x+w-r+r*Math.cos(a),y:y+r+r*Math.sin(a),ang:a+Math.PI/2}}t-=arc;
 if(t<straightB)return{x:x+w,y:y+r+t,ang:Math.PI/2};t-=straightB;
 if(t<arc){let a=t/r;return{x:x+w-r+r*Math.cos(a),y:y+h-r+r*Math.sin(a),ang:a+Math.PI/2}}t-=arc;
 if(t<straightA)return{x:x+w-r-t,y:y+h,ang:Math.PI};t-=straightA;
 if(t<arc){let a=Math.PI/2+t/r;return{x:x+r+r*Math.cos(a),y:y+h-r+r*Math.sin(a),ang:a+Math.PI/2}}t-=arc;
 if(t<straightB)return{x,y:y+h-r-t,ang:-Math.PI/2};t-=straightB;
 let a=Math.PI+t/r;return{x:x+r+r*Math.cos(a),y:y+r+r*Math.sin(a),ang:a+Math.PI/2};
}

function spawn(){
 const d=D[level];bottles=[];bullets=[];particles=[];ammo=d[2];timeLeft=d[3];
 const n=d[0]+d[1];
 for(let i=0;i<n;i++)bottles.push({t:i/n+Math.random()*.02,s:d[4]*(.88+Math.random()*.2),danger:i>=d[0],alive:true});
 hud();
}
function hud(){document.getElementById("score").textContent=score;document.getElementById("level").textContent=level+"/"+TOTAL;document.getElementById("ammo").textContent=ammo;document.getElementById("time").textContent=Math.max(0,Math.ceil(timeLeft))}

function bottle(b){
 const p=point(b.t*LEN);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.ang);
 ctx.shadowBlur=b.danger?20:15;ctx.shadowColor=b.danger?"#ff243d":"#00ff8a";
 
 let g=ctx.createLinearGradient(-20,0,20,0);
 g.addColorStop(0,b.danger?"#60000a":"#004d25");
 g.addColorStop(0.3,b.danger?"#ff2b48":"#00ff7f");
 g.addColorStop(0.8,b.danger?"#800010":"#00803d");
 ctx.fillStyle=g;
 
 ctx.beginPath();
 ctx.moveTo(-18,30);ctx.lineTo(18,30);ctx.lineTo(16,-15);ctx.lineTo(8,-25);
 ctx.lineTo(8,-45);ctx.lineTo(-8,-45);ctx.lineTo(-8,-25);ctx.lineTo(-16,-15);
 ctx.closePath();ctx.fill();
 
 ctx.fillStyle=b.danger?"#ff8090":"#a3ffce";ctx.fillRect(-6,-48,12,5);
 ctx.fillStyle="#ffffff44";ctx.fillRect(-12,-10,5,30);
 ctx.shadowBlur=0;ctx.fillStyle=b.danger?"#fff":"#000";ctx.font="900 12px Arial";ctx.textAlign="center";ctx.fillText(b.danger?"☠":"★",0,10);
 ctx.restore();
}

function createShards(x, y, isDanger) {
  const color = isDanger ? ["#ff243d", "#900010", "#ff8090"] : ["#00ff8a", "#006633", "#a3ffce"];
  for (let i = 0; i < 18; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 150 + Math.random() * 300;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size: 4 + Math.random() * 8,
      color: color[Math.floor(Math.random() * color.length)],
      life: 0.5 + Math.random() * 0.4
    });
  }
}

function gun(){
 const gx=500,gy=500;ctx.save();ctx.translate(gx,gy);ctx.rotate(aimAngle);
 
 ctx.shadowBlur=20;ctx.shadowColor="#00eaff";ctx.fillStyle="#0a121c";
 ctx.beginPath();ctx.arc(0,0,45,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle="#00eaff";ctx.lineWidth=4;ctx.stroke();ctx.shadowBlur=0;
 
 let g=ctx.createLinearGradient(0,-10,0,10);
 g.addColorStop(0,"#d0e8f2");g.addColorStop(0.5,"#4a5c66");g.addColorStop(1,"#182228");
 ctx.fillStyle=g;ctx.roundRect(10,-12,110,24,6);ctx.fill();
 
 ctx.fillStyle="#10181e";ctx.fillRect(115,-15,15,30);
 ctx.fillStyle="#ffb23d";ctx.fillRect(125,-8,8,16);
 
 ctx.fillStyle="#8b4e25";ctx.roundRect(-25,10,22,45,6);ctx.fill();
 
 if(flashTime > 0) {
   ctx.fillStyle="#ffea00";ctx.beginPath();ctx.arc(140,0,25+Math.random()*10,0,Math.PI*2);ctx.fill();
   ctx.fillStyle="#ff3300";ctx.beginPath();ctx.arc(145,0,15,0,Math.PI*2);ctx.fill();
   ctx.fillStyle="#ffffffaa";ctx.beginPath();ctx.arc(155,0,30,0,Math.PI*2);ctx.fill();
 }
 ctx.restore();
}

function drawBullet(b){
  ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.atan2(b.vy,b.vx));
  ctx.shadowBlur=15;ctx.shadowColor="#ffd21c";ctx.fillStyle="#ffd21c";
  ctx.beginPath();ctx.ellipse(0,0,14,4,0,0,Math.PI*2);ctx.fill();ctx.restore();
}

function draw(){
 ctx.clearRect(0,0,W,H);ctx.fillStyle="#050812";ctx.fillRect(0,0,W,H);ctx.strokeStyle="#00d9ff10";ctx.lineWidth=2;
 for(let x=30;x<W;x+=55){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=30;y<H;y+=55){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 ctx.save();ctx.shadowBlur=25;ctx.shadowColor="#00eaff";ctx.strokeStyle="#00eaff";ctx.lineWidth=15;ctx.roundRect(P.x,P.y,P.w,P.h,P.r);ctx.stroke();ctx.shadowBlur=0;ctx.strokeStyle="#b9fbff";ctx.lineWidth=4;ctx.stroke();ctx.restore();
 
 bottles.forEach(b=>b.alive&&bottle(b));
 
 particles.forEach(p => {
   ctx.fillStyle = p.color;
   ctx.beginPath();ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);ctx.fill();
 });
 
 bullets.forEach(drawBullet);gun();
 
 if(msg){ctx.fillStyle="#000c";ctx.fillRect(280,455,440,90);ctx.strokeStyle="#00eaff";ctx.lineWidth=3;ctx.strokeRect(280,455,440,90);ctx.fillStyle="#fff";ctx.font="900 28px Arial";ctx.fillText(msg,500,510)}
}

function fire(x,y){
 if(!running||paused||ammo<=0)return;
 let dx=x-500,dy=y-500,len=Math.hypot(dx,dy);if(len<5)return;
 targetAngle=Math.atan2(dy,dx);
 ammo--;hud();beep("shoot");flashTime=0.08;
 bullets.push({x:500+Math.cos(targetAngle)*120,y:500+Math.sin(targetAngle)*120,vx:dx/len*1200,vy:dy/len*1200,life:1.2});
}

canvas.addEventListener("pointerdown",e=>{
  if(audio && audio.state === 'suspended') { audio.resume(); }
  const r=canvas.getBoundingClientRect();
  fire((e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H);
});

function update(dt){
 if(!running||paused)return;timeLeft-=dt;if(timeLeft<=0){timeLeft=0;hud();end("TIME UP");return}
 
 if(flashTime > 0) flashTime -= dt;
 
 let diff = targetAngle - aimAngle;
 diff = Math.atan2(Math.sin(diff), Math.cos(diff));
 aimAngle += diff * Math.min(1, dt * 25);
 
 bottles.forEach(b=>{if(b.alive)b.t+=b.s*dt});
 bullets.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt});
 
 particles.forEach(p => {
   p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
   p.size = Math.max(0, p.size - dt * 5);
 });
 particles = particles.filter(p => p.life > 0);

 for(const bl of bullets){
   if(bl.life<=0)continue;
   for(const b of bottles){
     if(!b.alive)continue;
     const p=point(b.t*LEN);
     if(Math.hypot(bl.x-p.x,bl.y-p.y)<40){
       b.alive=false;bl.life=0;
       createShards(p.x, p.y, b.danger);
       if(b.danger){end("DANGER BOTTLE HIT");return}
       else{score+=10;coins+=2;localStorage.setItem("gzd_coins",coins);document.getElementById("coins").textContent=coins;beep("hit")}
     }
   }
 }
 bullets=bullets.filter(b=>b.life>0&&b.x>-60&&b.x<W+60&&b.y>-60&&b.y<H+60);
 if(bottles.filter(b=>b.alive&&!b.danger).length===0){nextLevel();return}
 if(ammo===0&&bottles.some(b=>b.alive&&!b.danger)&&bullets.length===0){end("OUT OF AMMO");return}hud();
}

function nextLevel(){
 if(level===TOTAL){score+=100;coins+=100;localStorage.setItem("gzd_coins",coins);document.getElementById("coins").textContent=coins;win();return}
 score+=25;coins+=10;localStorage.setItem("gzd_coins",coins);document.getElementById("coins").textContent=coins;level++;msg="LEVEL "+level;spawn();setTimeout(()=>msg="",700);beep("level");
}

function end(r){if(!running)return;running=false;document.getElementById("overlayIcon").textContent="💥";document.getElementById("overlayTitle").textContent="GAME OVER";document.getElementById("overlayText").textContent=r+" • Score: "+score;document.getElementById("reward").textContent="";document.getElementById("overlay").classList.add("show");beep("lose")}
function win(){running=false;document.getElementById("overlayIcon").textContent="🏆";document.getElementById("overlayTitle").textContent="YOU WIN";document.getElementById("overlayText").textContent="All 20 levels complete!";document.getElementById("reward").textContent="+100 🪙";document.getElementById("overlay").classList.add("show");beep("level")}
function restart(){score=0;level=1;running=true;paused=false;document.getElementById("overlay").classList.remove("show");spawn()}
function togglePause(){if(!running)return;paused=!paused;document.getElementById("overlay").classList.toggle("show",paused);if(paused){document.getElementById("overlayIcon").textContent="⏸️";document.getElementById("overlayTitle").textContent="PAUSED";document.getElementById("overlayText").textContent="Tap PAUSE again to continue";document.getElementById("reward").textContent=""}}
function toggleSound(){soundOn=!soundOn;document.getElementById("soundText").textContent=soundOn?"🔊 SOUND":"🔇 SOUND"}

function beep(t){
  if(!soundOn)return;
  try{
    audio=audio||new(window.AudioContext||window.webkitAudioContext)();
    if (audio.state === 'suspended') { audio.resume(); }
    let o=audio.createOscillator(),g=audio.createGain();
    o.connect(g);g.connect(audio.destination);
    o.frequency.value=t==="shoot"?420:t==="hit"?720:t==="level"?980:t==="lose"?130:620;
    g.gain.setValueAtTime(.045,audio.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.12);
    o.start();o.stop(audio.currentTime+.12);
  }catch(e){}
}

function goBack(){
  if(history.length > 1) { window.history.back(); } 
  else { alert("No back page found!"); }
}

function loop(now){let dt=Math.min((now-last)/1000,.035);last=now;update(dt);draw();requestAnimationFrame(loop)}
spawn();requestAnimationFrame(loop);
</script>
</body>
</html>
