<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#05050d">
<title>Bottle Shoot - Game Zone By Danish</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%;background:#05050d;color:#fff;font-family:Arial,sans-serif}
body{overflow:hidden}
.app{width:100%;max-width:560px;margin:auto;padding:14px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.logo{font-size:23px;font-weight:1000;background:linear-gradient(90deg,#00eaff,#9c2cff,#ff24bd);-webkit-background-clip:text;color:transparent}
.by{font-size:8px;color:#777;letter-spacing:3px}
.coins{background:#171323;border:1px solid #ffd21c55;border-radius:18px;padding:8px 13px;font-weight:bold}
.coins span{color:#ffd21c}
.back{background:#141426;border:1px solid #292941;color:#aaa;padding:8px 13px;border-radius:12px;margin-bottom:10px}
.card{background:#0e0e1b;border:1px solid #00d9ff30;border-radius:24px;padding:14px;box-shadow:0 20px 60px #0008}
.title{text-align:center;font-size:23px;font-weight:1000}
.subtitle{text-align:center;color:#77778c;font-size:11px;margin:4px 0 11px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.stat{background:#090914;border:1px solid #202038;border-radius:13px;padding:8px 3px;text-align:center}
.stat strong{display:block;font-size:17px}
.stat small{color:#66667b;font-size:7px}
.gameWrap{position:relative;width:min(92vw,430px);aspect-ratio:3/4;margin:auto}
canvas{width:100%;height:100%;display:block;border-radius:20px;border:2px solid #00eaff55;background:#070713;touch-action:none}
.overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;border-radius:20px;background:#000b;backdrop-filter:blur(5px)}
.overlay.show{display:flex}
.overlayBox{text-align:center;padding:25px}
.overlayIcon{font-size:52px}
.overlayTitle{font-size:27px;font-weight:1000;margin:5px 0}
.reward{color:#ffd21c;font-weight:bold;margin:8px}
.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}
.btn{border:0;border-radius:13px;padding:12px 5px;color:#fff;font-weight:900;background:linear-gradient(90deg,#008cff,#962cff)}
.btn.secondary{background:#151527;border:1px solid #292941}
.hint{text-align:center;color:#aaa;font-size:11px;margin-top:10px}
.coinPop{position:fixed;color:#ffd21c;font-size:19px;font-weight:1000;pointer-events:none;animation:up .7s forwards;z-index:50}
@keyframes up{to{opacity:0;transform:translateY(-55px) scale(1.3)}}
</style>
</head>

<body>

<div class="app">

<div class="header">
  <div>
    <div class="logo">GAME ZONE</div>
    <div class="by">BY DANISH</div>
  </div>

  <div class="coins">🪙 <span id="coins">100</span></div>
</div>

<button class="back" onclick="location.href='index.html'">← Games</button>

<div class="card">

<div class="title">🎯 BOTTLE SHOOT</div>
<div class="subtitle">Aim • Shoot • Break</div>

<div class="stats">
  <div class="stat"><strong id="score">0</strong><small>SCORE</small></div>
  <div class="stat"><strong id="hits">0</strong><small>HITS</small></div>
  <div class="stat"><strong id="shots">0</strong><small>SHOTS</small></div>
  <div class="stat"><strong id="time">30</strong><small>TIME</small></div>
</div>

<div class="gameWrap">

<canvas id="game"></canvas>

<div class="overlay" id="overlay">
<div class="overlayBox">
  <div class="overlayIcon" id="overlayIcon">🏆</div>
  <div class="overlayTitle" id="overlayTitle">ROUND OVER</div>
  <div id="finalScore">Score: 0</div>
  <div class="reward" id="reward">+0 🪙</div>
  <button class="btn" onclick="restart()">🔄 PLAY AGAIN</button>
</div>
</div>

</div>

<div class="controls">
<button class="btn" onclick="restart()">🔄 RESTART</button>
<button class="btn secondary" onclick="pauseGame()">⏸️ PAUSE</button>
<button class="btn secondary" onclick="soundToggle()"><span id="sound">🔊 SOUND</span></button>
</div>

<div class="hint">Tap anywhere on the game to shoot 🎯</div>

</div>
</div>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=0,H=0;
let score=0,hits=0,shots=0,time=30;
let coins=Number(localStorage.getItem("gzd_coins")||100);
let running=true,paused=false,soundOn=true;

let bottle={
  x:0,
  y:0,
  r:24,
  t:0
};

let bullet=null;
let particles=[];
let last=0;
let clock;

document.getElementById("coins").textContent=coins;

function resize(){

  const r=canvas.getBoundingClientRect();

  W=Math.floor(r.width);
  H=Math.floor(r.height);

  canvas.width=W;
  canvas.height=H;

  if(!bottle.x){
    bottle.x=W*.2;
    bottle.y=H*.18;
  }
}

window.addEventListener("resize",resize);

function resetBottle(){

  bottle.t=0;

  bottle.x=W*.20;
  bottle.y=H*.18;
}

function start(){

  score=0;
  hits=0;
  shots=0;
  time=30;

  running=true;
  paused=false;

  bullet=null;
  particles=[];

  resetBottle();

  document.getElementById("score").textContent=0;
  document.getElementById("hits").textContent=0;
  document.getElementById("shots").textContent=0;
  document.getElementById("time").textContent=30;

  document.getElementById("overlay").classList.remove("show");

  clearInterval(clock);

  clock=setInterval(()=>{

    if(!running||paused)return;

    time--;

    document.getElementById("time").textContent=time;

    if(time<=0)gameOver();

  },1000);
}

function update(dt){

  if(!running||paused)return;

  /*
    ONE CLOSED PATH
  */

  bottle.t+=dt*.20;

  const left=W*.16;
  const right=W*.84;
  const top=H*.18;
  const bottom=H*.65;

  const width=right-left;
  const height=bottom-top;
  const perimeter=2*(width+height);

  let d=(bottle.t%1)*perimeter;

  if(d<width){
    bottle.x=left+d;
    bottle.y=top;
  }
  else if(d<width+height){
    d-=width;
    bottle.x=right;
    bottle.y=top+d;
  }
  else if(d<2*width+height){
    d-=width+height;
    bottle.x=right-d;
    bottle.y=bottom;
  }
  else{
    d-=2*width+height;
    bottle.x=left;
    bottle.y=bottom-d;
  }

  if(bullet){

    bullet.x+=bullet.vx*dt;
    bullet.y+=bullet.vy*dt;

    const dx=bullet.x-bottle.x;
    const dy=bullet.y-bottle.y;

    if(Math.hypot(dx,dy)<bottle.r+7){

      hit();

      bullet=null;

    }
    else if(
      bullet.x<0||
      bullet.x>W||
      bullet.y<0||
      bullet.y>H
    ){

      bullet=null;

    }
  }

  particles.forEach(p=>{
    p.x+=p.vx*dt;
    p.y+=p.vy*dt;
    p.vy+=300*dt;
    p.life-=dt;
  });

  particles=particles.filter(p=>p.life>0);
}

function draw(){

  ctx.clearRect(0,0,W,H);

  /* background */

  ctx.fillStyle="#070713";
  ctx.fillRect(0,0,W,H);

  /* grid */

  ctx.strokeStyle="rgba(0,220,255,.06)";
  ctx.lineWidth=1;

  for(let x=0;x<W;x+=30){
    ctx.beginPath();
    ctx.moveTo(x,0);
    ctx.lineTo(x,H);
    ctx.stroke();
  }

  for(let y=0;y<H;y+=30){
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(W,y);
    ctx.stroke();
  }

  /* PATH */

  const left=W*.16;
  const right=W*.84;
  const top=H*.18;
  const bottom=H*.65;

  ctx.strokeStyle="#dffcff";
  ctx.lineWidth=4;
  ctx.shadowBlur=12;
  ctx.shadowColor="#00eaff";

  ctx.beginPath();

  ctx.moveTo(left,top);
  ctx.lineTo(right,top);
  ctx.lineTo(right,bottom);
  ctx.lineTo(left,bottom);
  ctx.closePath();

  ctx.stroke();

  ctx.shadowBlur=0;

  drawBottle();
  drawBullet();
  drawGun();
  drawParticles();
}

function drawBottle(){

  const x=bottle.x;
  const y=bottle.y;
  const s=bottle.r;

  ctx.save();
  ctx.translate(x,y);

  /* glow */

  ctx.shadowBlur=25;
  ctx.shadowColor="#00eaff";

  /* bottle */

  const g=ctx.createLinearGradient(-s,-s,s,s);
  g.addColorStop(0,"#00ffff");
  g.addColorStop(1,"#0070ff");

  ctx.fillStyle=g;

  ctx.beginPath();
  ctx.roundRect(-s*.62,-s*.75,s*1.24,s*1.5,8);
  ctx.fill();

  /* neck */

  ctx.shadowBlur=0;

  ctx.fillStyle="#d9ffff";

  ctx.fillRect(-s*.25,-s*1.05,s*.5,s*.35);

  /* cap */

  ctx.fillStyle="#ffffff";

  ctx.fillRect(-s*.28,-s*1.12,s*.56,s*.09);

  /* label */

  ctx.fillStyle="#ff24b9";

  ctx.fillRect(-s*.56,-s*.12,s*1.12,s*.38);

  ctx.fillStyle="#fff";

  ctx.font="bold 9px Arial";
  ctx.textAlign="center";
  ctx.textBaseline="middle";

  ctx.fillText("ZONE",0,s*.07);

  ctx.restore();
}

function drawGun(){

  const gx=W/2;
  const gy=H*.91;

  const angle=Math.atan2(
    bottle.y-gy,
    bottle.x-gx
  );

  ctx.save();

  ctx.translate(gx,gy);
  ctx.rotate(angle);

  /* barrel */

  ctx.shadowBlur=12;
  ctx.shadowColor="#ff5722";

  ctx.fillStyle="#d7d7d7";

  ctx.fillRect(-5,-7,58,14);

  ctx.fillStyle="#777";

  ctx.fillRect(43,-10,18,20);

  /* grip */

  ctx.shadowBlur=0;

  ctx.fillStyle="#a96838";

  ctx.beginPath();

  ctx.roundRect(-16,7,24,40,7);

  ctx.fill();

  ctx.fillStyle="#63391f";

  ctx.fillRect(-12,18,16,24);

  ctx.restore();
}

function drawBullet(){

  if(!bullet)return;

  ctx.save();

  ctx.fillStyle="#ffd21c";
  ctx.shadowBlur=18;
  ctx.shadowColor="#ff6b00";

  ctx.beginPath();

  ctx.arc(
    bullet.x,
    bullet.y,
    5,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();
}

function drawParticles(){

  particles.forEach(p=>{

    ctx.globalAlpha=Math.max(0,p.life);

    ctx.fillStyle="#ff24b9";

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      p.size,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.globalAlpha=1;

  });
}

function shoot(){

  if(!running||paused)return;

  shots++;

  document.getElementById("shots").textContent=shots;

  const gx=W/2;
  const gy=H*.91;

  const dx=bottle.x-gx;
  const dy=bottle.y-gy;

  const len=Math.hypot(dx,dy);

  bullet={
    x:gx,
    y:gy,
    vx:dx/len*850,
    vy:dy/len*850
  };

  beep(450);
}

function hit(){

  score+=10;
  hits++;

  coins++;

  localStorage.setItem("gzd_coins",coins);

  document.getElementById("coins").textContent=coins;
  document.getElementById("score").textContent=score;
  document.getElementById("hits").textContent=hits;

  for(let i=0;i<25;i++){

    const a=Math.random()*Math.PI*2;
    const s=80+Math.random()*180;

    particles.push({
      x:bottle.x,
      y:bottle.y,
      vx:Math.cos(a)*s,
      vy:Math.sin(a)*s,
      life:1,
      size:2+Math.random()*4
    });
  }

  showCoin();
  beep(850);

  resetBottle();
}

function gameOver(){

  if(!running)return;

  running=false;

  clearInterval(clock);

  const reward=Math.floor(score/10);

  coins+=reward;

  localStorage.setItem("gzd_coins",coins);

  document.getElementById("coins").textContent=coins;

  document.getElementById("finalScore").textContent=
    "Score: "+score+" • Hits: "+hits;

  document.getElementById("reward").textContent=
    "+"+reward+" 🪙";

  document.getElementById("overlayIcon").textContent="🏆";
  document.getElementById("overlayTitle").textContent="ROUND OVER";

  document.getElementById("overlay").classList.add("show");
}

function restart(){
  start();
}

function pauseGame(){

  if(!running)return;

  paused=!paused;

  if(paused){

    document.getElementById("overlayIcon").textContent="⏸️";
    document.getElementById("overlayTitle").textContent="PAUSED";
    document.getElementById("finalScore").textContent="Score: "+score;
    document.getElementById("reward").textContent="Press PAUSE again";

    document.getElementById("overlay").classList.add("show");

  }else{

    document.getElementById("overlay").classList.remove("show");

  }
}

function soundToggle(){

  soundOn=!soundOn;

  document.getElementById("sound").textContent=
    soundOn?"🔊 SOUND":"🔇 SOUND";
}

function beep(freq){

  if(!soundOn)return;

  try{

    const A=
      window.AudioContext||
      window.webkitAudioContext;

    const a=new A();

    const o=a.createOscillator();
    const g=a.createGain();

    o.connect(g);
    g.connect(a.destination);

    o.frequency.value=freq;

    g.gain.setValueAtTime(.04,a.currentTime);

    g.gain.exponentialRampToValueAtTime(
      .001,
      a.currentTime+.12
    );

    o.start();
    o.stop(a.currentTime+.12);

  }catch(e){}
}

function showCoin(){

  const e=document.createElement("div");

  e.className="coinPop";
  e.textContent="+1 🪙";
  e.style.left="50%";
  e.style.top="45%";

  document.body.appendChild(e);

  setTimeout(()=>e.remove(),700);
}

canvas.addEventListener("pointerdown",e=>{
  e.preventDefault();
  shoot();
});

function loop(t){

  if(!last)t;

  const dt=Math.min(
    ((t-last)||0)/1000,
    .04
  );

  last=t;

  update(dt);
  draw();

  requestAnimationFrame(loop);
}

resize();
start();
requestAnimationFrame(loop);

</script>

</body>
</html>
