<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#070714">
<title>Game Zone By Danish</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

body{
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  color:white;
  background:
    radial-gradient(circle at 20% 10%,#35116b 0%,transparent 35%),
    radial-gradient(circle at 80% 90%,#061e63 0%,transparent 35%),
    #05050d;
  display:flex;
  justify-content:center;
  overflow-x:hidden;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background-image:
    radial-gradient(circle,rgba(0,229,255,.18) 1px,transparent 1px);
  background-size:35px 35px;
  opacity:.25;
}

.app{
  width:100%;
  max-width:500px;
  min-height:100vh;
  padding:18px 16px 30px;
  position:relative;
}

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:22px;
}

.brand{
  font-size:25px;
  font-weight:900;
  letter-spacing:1px;
  background:linear-gradient(90deg,#00eaff,#b52cff,#ff2ca8);
  -webkit-background-clip:text;
  color:transparent;
  text-shadow:0 0 20px rgba(0,220,255,.3);
}

.by{
  font-size:11px;
  color:#aaa;
  margin-top:3px;
  letter-spacing:2px;
}

.coins{
  padding:9px 13px;
  border:1px solid rgba(255,210,0,.4);
  border-radius:18px;
  background:rgba(255,190,0,.08);
  box-shadow:0 0 18px rgba(255,190,0,.12);
  font-weight:bold;
}

.coin{
  color:#ffd21c;
}

.card{
  background:rgba(14,14,30,.82);
  border:1px solid rgba(0,225,255,.18);
  border-radius:24px;
  padding:18px;
  box-shadow:
    0 15px 50px rgba(0,0,0,.45),
    inset 0 0 30px rgba(0,150,255,.03);
  backdrop-filter:blur(10px);
}

.title{
  text-align:center;
  margin-bottom:5px;
  font-size:22px;
  font-weight:900;
}

.subtitle{
  text-align:center;
  color:#85859c;
  font-size:12px;
  margin-bottom:18px;
}

.status{
  text-align:center;
  min-height:28px;
  font-weight:bold;
  color:#00eaff;
  font-size:15px;
}

.board{
  width:min(88vw,360px);
  aspect-ratio:1;
  margin:16px auto;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}

.cell{
  border:1px solid rgba(0,220,255,.25);
  border-radius:18px;
  background:linear-gradient(145deg,#111127,#080817);
  color:white;
  font-size:clamp(42px,14vw,68px);
  font-weight:900;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:.18s;
  box-shadow:inset 0 0 20px rgba(0,180,255,.03);
}

.cell:active{
  transform:scale(.92);
}

.cell.x{
  color:#00eaff;
  text-shadow:0 0 18px #00eaff;
  animation:pop .25s ease;
}

.cell.o{
  color:#ff29bd;
  text-shadow:0 0 18px #ff29bd;
  animation:pop .25s ease;
}

.cell.win{
  animation:winner .65s infinite alternate;
  border-color:#ffd21c;
}

@keyframes pop{
  0%{transform:scale(.3);opacity:0}
  70%{transform:scale(1.12)}
  100%{transform:scale(1);opacity:1}
}

@keyframes winner{
  from{
    box-shadow:0 0 8px rgba(255,210,28,.3);
  }
  to{
    box-shadow:0 0 28px rgba(255,210,28,.9);
  }
}

.controls{
  display:flex;
  gap:10px;
  margin-top:8px;
}

button{
  font-family:inherit;
}

.mainBtn{
  flex:1;
  border:0;
  border-radius:15px;
  padding:14px;
  color:white;
  font-weight:900;
  font-size:14px;
  cursor:pointer;
  background:linear-gradient(90deg,#007cff,#9b19ff);
  box-shadow:0 8px 25px rgba(83,30,255,.28);
  transition:.18s;
}

.mainBtn:active{
  transform:scale(.95);
}

.secondary{
  background:#151527;
  border:1px solid #292943;
}

.stats{
  display:flex;
  gap:10px;
  margin-top:15px;
}

.stat{
  flex:1;
  text-align:center;
  background:#0b0b18;
  border-radius:14px;
  padding:11px 5px;
  border:1px solid #1c1c35;
}

.stat strong{
  display:block;
  font-size:18px;
}

.stat span{
  color:#77778e;
  font-size:10px;
}

.sound{
  margin-top:16px;
  display:flex;
  justify-content:center;
}

.soundBtn{
  background:#101021;
  color:#aaa;
  border:1px solid #28283d;
  padding:9px 15px;
  border-radius:20px;
  cursor:pointer;
}

.popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:20;
  backdrop-filter:blur(7px);
}

.popup.show{
  display:flex;
  animation:fade .2s ease;
}

@keyframes fade{
  from{opacity:0}
  to{opacity:1}
}

.popupBox{
  width:min(88%,350px);
  background:linear-gradient(145deg,#16162c,#080813);
  border:1px solid #743cff;
  border-radius:25px;
  padding:28px;
  text-align:center;
  box-shadow:0 0 60px rgba(117,40,255,.35);
  animation:popup .3s ease;
}

@keyframes popup{
  from{transform:scale(.7)}
  to{transform:scale(1)}
}

.resultIcon{
  font-size:58px;
  margin-bottom:10px;
}

.resultTitle{
  font-size:27px;
  font-weight:900;
}

.reward{
  color:#ffd21c;
  font-weight:bold;
  margin:10px;
}

.confetti{
  position:fixed;
  width:7px;
  height:15px;
  top:-20px;
  z-index:30;
  animation:fall 1.5s linear forwards;
}

@keyframes fall{
  to{
    transform:translateY(110vh) rotate(720deg);
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div>
      <div class="brand">GAME ZONE</div>
      <div class="by">BY DANISH</div>
    </div>

    <div class="coins">
      🪙 <span id="coins">100</span>
    </div>
  </div>

  <div class="card">

    <div class="title">❌⭕ TIC-TAC-TOE</div>
    <div class="subtitle">Challenge the Bot</div>

    <div class="status" id="status">Your turn — X</div>

    <div class="board" id="board">
      <button class="cell" data-i="0"></button>
      <button class="cell" data-i="1"></button>
      <button class="cell" data-i="2"></button>
      <button class="cell" data-i="3"></button>
      <button class="cell" data-i="4"></button>
      <button class="cell" data-i="5"></button>
      <button class="cell" data-i="6"></button>
      <button class="cell" data-i="7"></button>
      <button class="cell" data-i="8"></button>
    </div>

    <div class="controls">
      <button class="mainBtn" onclick="newGame()">🔄 NEW GAME</button>
      <button class="mainBtn secondary" onclick="resetCoins()">🪙 RESET</button>
    </div>

    <div class="stats">
      <div class="stat">
        <strong id="wins">0</strong>
        <span>WINS</span>
      </div>

      <div class="stat">
        <strong id="draws">0</strong>
        <span>DRAWS</span>
      </div>

      <div class="stat">
        <strong id="losses">0</strong>
        <span>LOSSES</span>
      </div>
    </div>

    <div class="sound">
      <button class="soundBtn" id="soundBtn" onclick="toggleSound()">
        🔊 Sound ON
      </button>
    </div>

  </div>
</div>

<div class="popup" id="popup">
  <div class="popupBox">
    <div class="resultIcon" id="resultIcon">🏆</div>
    <div class="resultTitle" id="resultTitle">YOU WIN!</div>
    <div class="reward" id="reward">+20 🪙</div>
    <button class="mainBtn" onclick="closePopup();newGame()">
      PLAY AGAIN
    </button>
  </div>
</div>

<script>
let board=["","","","","","","","",""];
let gameOver=false;
let playerTurn=true;
let soundOn=true;

let coins=Number(localStorage.getItem("gzd_coins")||100);
let wins=Number(localStorage.getItem("gzd_wins")||0);
let draws=Number(localStorage.getItem("gzd_draws")||0);
let losses=Number(localStorage.getItem("gzd_losses")||0);

const cells=document.querySelectorAll(".cell");

function updateUI(){
  document.getElementById("coins").textContent=coins;
  document.getElementById("wins").textContent=wins;
  document.getElementById("draws").textContent=draws;
  document.getElementById("losses").textContent=losses;

  localStorage.setItem("gzd_coins",coins);
  localStorage.setItem("gzd_wins",wins);
  localStorage.setItem("gzd_draws",draws);
  localStorage.setItem("gzd_losses",losses);
}

updateUI();

function beep(type){
  if(!soundOn) return;

  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();

    osc.connect(gain);
    gain.connect(ctx.destination);

    if(type==="win"){
      osc.frequency.setValueAtTime(500,ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(1000,ctx.currentTime+.35);
    }
    else if(type==="lose"){
      osc.frequency.setValueAtTime(400,ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(150,ctx.currentTime+.35);
    }
    else{
      osc.frequency.setValueAtTime(520,ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(700,ctx.currentTime+.08);
    }

    gain.gain.setValueAtTime(.08,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.35);

    osc.start();
    osc.stop(ctx.currentTime+.35);
  }catch(e){}
}

function toggleSound(){
  soundOn=!soundOn;

  document.getElementById("soundBtn").textContent=
    soundOn ? "🔊 Sound ON" : "🔇 Sound OFF";

  if(soundOn) beep("tap");
}

cells.forEach(cell=>{
  cell.addEventListener("click",()=>{
    const i=Number(cell.dataset.i);

    if(!playerTurn || gameOver || board[i]) return;

    board[i]="X";
    render();
    beep("tap");

    let result=checkWinner();

    if(result){
      finish(result);
      return;
    }

    playerTurn=false;
    document.getElementById("status").textContent="🤖 Bot is thinking...";

    setTimeout(botMove,450);
  });
});

function render(){
  cells.forEach((cell,i)=>{
    cell.textContent=board[i];

    cell.classList.remove("x","o");

    if(board[i]==="X") cell.classList.add("x");
    if(board[i]==="O") cell.classList.add("o");
  });
}

function botMove(){
  if(gameOver) return;

  let available=board
    .map((v,i)=>v===""?i:null)
    .filter(v=>v!==null);

  if(!available.length) return;

  let move=findBestMove();

  board[move]="O";
  render();
  beep("tap");

  let result=checkWinner();

  if(result){
    finish(result);
    return;
  }

  playerTurn=true;
  document.getElementById("status").textContent="Your turn — X";
}

function findBestMove(){

  // Win if possible
  for(let i=0;i<9;i++){
    if(board[i]===""){
      board[i]="O";
      if(checkWinner()==="O"){
        board[i]="";
        return i;
      }
      board[i]="";
    }
  }

  // Block player
  for(let i=0;i<9;i++){
    if(board[i]===""){
      board[i]="X";
      if(checkWinner()==="X"){
        board[i]="";
        return i;
      }
      board[i]="";
    }
  }

  // Center
  if(board[4]==="") return 4;

  // Corners
  let corners=[0,2,6,8].filter(i=>board[i]==="");
  if(corners.length){
    return corners[Math.floor(Math.random()*corners.length)];
  }

  let available=board
    .map((v,i)=>v===""?i:null)
    .filter(v=>v!==null);

  return available[Math.floor(Math.random()*available.length)];
}

function checkWinner(){

  const lines=[
    [0,1,2],
    [3,4,5],
    [6,7,8],
    [0,3,6],
    [1,4,7],
    [2,5,8],
    [0,4,8],
    [2,4,6]
  ];

  for(const line of lines){

    const [a,b,c]=line;

    if(
      board[a] &&
      board[a]===board[b] &&
      board[a]===board[c]
    ){
      line.forEach(i=>cells[i].classList.add("win"));
      return board[a];
    }
  }

  if(board.every(Boolean)) return "draw";

  return null;
}

function finish(result){

  gameOver=true;
  playerTurn=false;

  let icon="";
  let title="";
  let reward="";

  if(result==="X"){
    wins++;
    coins+=20;

    icon="🏆";
    title="YOU WIN!";
    reward="+20 🪙";

    beep("win");
    confetti();
  }
  else if(result==="O"){
    losses++;

    icon="🤖";
    title="BOT WINS";
    reward="+0 🪙";

    beep("lose");
  }
  else{
    draws++;
    coins+=5;

    icon="🤝";
    title="DRAW!";
    reward="+5 🪙";

    beep("tap");
  }

  updateUI();

  document.getElementById("resultIcon").textContent=icon;
  document.getElementById("resultTitle").textContent=title;
  document.getElementById("reward").textContent=reward;

  setTimeout(()=>{
    document.getElementById("popup").classList.add("show");
  },500);
}

function closePopup(){
  document.getElementById("popup").classList.remove("show");
}

function newGame(){

  closePopup();

  board=["","","","","","","","",""];
  gameOver=false;
  playerTurn=true;

  cells.forEach(cell=>{
    cell.textContent="";
    cell.classList.remove("x","o","win");
  });

  document.getElementById("status").textContent="Your turn — X";
}

function resetCoins(){

  coins=100;
  wins=0;
  draws=0;
  losses=0;

  updateUI();
  beep("tap");
}

function confetti(){

  for(let i=0;i<35;i++){

    const c=document.createElement("div");

    c.className="confetti";

    c.style.left=Math.random()*100+"vw";
    c.style.animationDelay=Math.random()*.5+"s";
    c.style.background=
      ["#00eaff","#ff29bd","#ffd21c","#7c3cff","#fff"]
      [Math.floor(Math.random()*5)];

    document.body.appendChild(c);

    setTimeout(()=>c.remove(),1800);
  }
}
</script>

</body>
</html>
